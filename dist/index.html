<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constellation Trainer</title></head>
<body class="standalone">
<!--
  Constellation Trainer — drag/zoom star map with three modes:
    explore : hover shows constellation, all labels on
    name    : a highlighted constellation is shown, pick its name (keys 1–4)
    find    : a name is given, click the constellation on the map
  Runs as an Eduskript plugin (feature-detects window.eduskript) or as a standalone page.

  Config attributes on <plugin>:
    mode       = explore | name | find | draw   (default explore)
    level      = 1 | 2 | 3                  (1 = 22 famous, 2 = 46, 3 = all 88; default 1)
    projection = map | sphere               (default map)
    height     = px                         (inline height, default 560)
    lang       = en | de | en,de             (constellation names; default en)

  Sky data: d3-celestial by Olaf Frohn (BSD-3-Clause) — Yale BSC stars to mag 6,
  IAU constellation boundaries, Milky Way outlines.
-->
<style>
  :root {
    --bg: #ffffff; --fg: #1f2937; --muted: #6b7280; --line: #d1d5db; --panel: #f3f4f6;
    --accent: #2563eb; --ok: #16a34a; --bad: #dc2626;
  }
  html[data-theme="dark"] {
    --bg: #111827; --fg: #e5e7eb; --muted: #9ca3af; --line: #374151; --panel: #1f2937;
    --accent: #60a5fa; --ok: #4ade80; --bad: #f87171;
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) body.standalone {
      --bg: #111827; --fg: #e5e7eb; --muted: #9ca3af; --line: #374151; --panel: #1f2937;
      --accent: #60a5fa; --ok: #4ade80; --bad: #f87171;
    }
  }
  html { overflow: hidden; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  #sq { display: flex; flex-direction: column; padding: 8px; gap: 6px; }
  body.standalone #sq, #sq.fs { height: 100vh; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .bar .sp { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  button, select {
    font: inherit; font-size: 13px; padding: 4px 10px; cursor: pointer; color: var(--fg);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  }
  .seg button { border: 0; border-radius: 0; border-left: 1px solid var(--line); }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  body:not(.standalone) #sq:not(.fs) .stage { flex: none; height: var(--h, 560px); }
  .stage { position: relative; flex: 1; min-height: 300px; border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden; background: #08093d; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  #sq[data-mode="find"] canvas { cursor: crosshair; }
  #quiz .score-big { font-size: 22px; font-weight: bold; color: #f2c94c; }
  .ov { position: absolute; color: #e8eaf6; font-size: 12px; pointer-events: none;
    text-shadow: 0 1px 2px #000; }
  #coord { left: 8px; bottom: 6px; font-variant-numeric: tabular-nums; }
  #tip { display: none; background: rgba(8,9,40,.9); border: 1px solid #8c7a2e; border-radius: 5px;
    padding: 3px 7px; font-size: 13px; }
  #tip i { color: #b8bdd8; }
  #score { right: 8px; top: 6px; text-align: right; font-size: 13px; line-height: 1.5; }
  #score b { font-size: 16px; }
  #score .meter { width: 140px; height: 5px; background: rgba(255,255,255,.18); border-radius: 3px;
    margin-left: auto; overflow: hidden; }
  #score .meter div { height: 100%; background: #d9a520; width: 0; transition: width .4s; }
  #quiz { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    width: min(560px, calc(100% - 16px)); background: rgba(8,9,40,.88); border: 1px solid #8c7a2e;
    border-radius: 10px; padding: 10px 12px; color: #e8eaf6; display: none; text-align: center; }
  #quiz .q { font-size: 15px; margin-bottom: 8px; }
  #quiz .q b { color: #f2c94c; font-size: 18px; font-style: italic; }
  #quiz .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #quiz button { background: #1b1e5e; color: #e8eaf6; border-color: #3a3f8f; padding: 7px 8px; font-style: italic; }
  #quiz button:hover { background: #262a7a; }
  #quiz button.ok { background: #1e7a3a; border-color: #4ade80; }
  #quiz button.bad { background: #8a2222; border-color: #f87171; }
  #quiz button kbd { font-style: normal; opacity: .55; font-size: 11px; margin-right: 6px; }
  #quiz .fb { min-height: 20px; margin-top: 6px; font-size: 13px; }
  #quiz .fb .y { color: #4ade80; } #quiz .fb .n { color: #f87171; }
  #quiz .row { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
  #quiz .row button { font-style: normal; }
  #layers { position: absolute; right: 8px; top: 8px; display: none; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; z-index: 5; font-size: 13px; }
  #layers label { display: block; cursor: pointer; white-space: nowrap; }
  #sel { position: absolute; left: 8px; top: 8px; max-height: calc(100% - 40px); overflow-y: auto;
    background: rgba(8,9,40,.85); border: 1px solid #8c7a2e; border-radius: 8px; padding: 6px 4px 6px 10px;
    color: #e8eaf6; font-size: 13px; display: none; min-width: 150px; }
  #sel .hd { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; color: #f2c94c; }
  #sel .hd span { flex: 1; }
  #sel ol { margin: 0; padding-left: 22px; }
  #sel li { cursor: pointer; font-style: italic; padding: 1px 0; }
  #sel li:hover { color: #f2c94c; }
  #sel li b { font-style: normal; opacity: .5; margin-left: 6px; padding: 0 3px; }
  #sel li b:hover { opacity: 1; color: #f87171; }
  #sel button { font-size: 11px; padding: 1px 6px; background: #1b1e5e; color: #e8eaf6; border-color: #3a3f8f; }
  #stories { position: absolute; left: 8px; top: 8px; max-height: calc(100% - 120px); overflow-y: auto;
    background: rgba(8,9,40,.92); border: 1px solid #8c7a2e; border-radius: 8px; padding: 8px 10px;
    color: #e8eaf6; font-size: 13px; display: none; width: min(360px, calc(100% - 16px)); z-index: 4; }
  #stories .hd { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; color: #f2c94c; font-weight: bold; }
  #stories .hd span { flex: 1; }
  #stories ol { margin: 0; padding-left: 20px; }
  #stories li { padding: 3px 0; }
  #stories li .t { cursor: pointer; font-style: italic; }
  #stories li .t:hover { color: #f2c94c; }
  #stories li small { opacity: .6; }
  #stories li .acts { float: right; }
  #stories li .acts b { cursor: pointer; opacity: .6; margin-left: 6px; font-weight: normal; font-size: 12px; }
  #stories li .acts b:hover { opacity: 1; color: #f2c94c; }
  .hint { font-size: 12px; opacity: .7; margin-top: 4px; }
  #player, #recbar { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    width: min(680px, calc(100% - 16px)); background: rgba(8,9,40,.9); border: 1px solid #8c7a2e;
    border-radius: 10px; padding: 8px 12px; color: #e8eaf6; display: none; z-index: 3; }
  #player .sub { min-height: 1.5em; font-size: 17px; text-align: center; margin-bottom: 6px; }
  .ctl { display: flex; align-items: center; gap: 8px; }
  .ctl .sp { flex: 1; }
  #player .ttl { font-style: italic; color: #f2c94c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30%; }
  #player .seek { position: relative; flex: 1; }
  #player .seek input { width: 100%; display: block; }
  #player .ticks { position: absolute; left: 8px; right: 8px; top: -5px; height: 6px; pointer-events: none; }
  #player .ticks i { position: absolute; width: 2px; height: 6px; background: #f2c94c; }
  #player .ticks i.on { background: #4ade80; }
  #pTime { font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
  #player button, #recbar button, #stories button { font-size: 12px; padding: 2px 8px; background: #1b1e5e;
    color: #e8eaf6; border-color: #3a3f8f; }
  #pEdit { display: none; max-height: 170px; overflow-y: auto; font-size: 12px; margin-top: 6px;
    border-top: 1px solid #3a3f8f; padding-top: 6px; }
  #pEdit .cue { display: flex; gap: 6px; align-items: center; padding: 1px 0; }
  #pEdit .cue.on { color: #4ade80; }
  #pEdit .cue i { flex: 1; }
  #pEdit .sl { display: flex; gap: 6px; }
  #pEdit .sl [contenteditable] { flex: 1; outline: none; border-bottom: 1px dotted #3a3f8f; }
  #recbar .big { font-size: 42px; text-align: center; color: #f87171; line-height: 1.1; }
  #recbar .dot { color: #f87171; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  #langs button { display: inline-flex; align-items: center; padding: 4px 8px; }
  #langs button svg { display: block; border-radius: 2px; }
  #langs button:not(.on) svg { opacity: .35; filter: grayscale(1); }
  #langs button.on { background: var(--panel); box-shadow: inset 0 -2px 0 var(--accent); color: var(--fg); }
  #starinfo { position: absolute; display: none; background: rgba(8,9,40,.92); border: 1px solid #8c7a2e;
    border-radius: 6px; padding: 5px 9px; color: #e8eaf6; font-size: 13px; pointer-events: none; z-index: 2; line-height: 1.45; }
  #starinfo b { color: #f2c94c; font-size: 14px; }
  #starinfo .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
  .credit { font-size: 11px; color: var(--muted); }
  .credit a { color: inherit; }
</style>

<div id="sq" data-mode="explore">
  <div class="bar">
    <div class="seg" id="modes">
      <button data-v="explore">Explore</button><button data-v="name">Name it</button><button data-v="find">Find it</button><button data-v="draw">Draw it</button>
    </div>
    <select id="level" title="Which constellations are quizzed">
      <option value="0">My list</option><option value="1">Famous 22</option><option value="2">Common 46</option><option value="3">All 88</option>
    </select>
    <div class="seg" id="projs">
      <button data-v="map" title="Rectangular RA/Dec chart">Chart</button><button data-v="sphere" title="Stereographic view, drag to rotate">Sphere</button>
    </div>
    <span class="sp"></span>
    <div class="seg" id="langs" title="Constellation names: English (Latin) / Deutsch">
      <button data-lang="en" title="English"><svg viewBox="0 0 60 30" width="24" height="12"><rect width="60" height="30" fill="#012169"/><path d="M0,0 60,30M60,0 0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 60,30M60,0 0,30" stroke="#C8102E" stroke-width="2"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg></button><button data-lang="de" title="Deutsch"><svg viewBox="0 0 32 32" width="14" height="14"><rect width="32" height="32" fill="#d52b1e"/><path d="M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z" fill="#fff"/></svg></button>
    </div>
    <button id="recenter" title="Centre on 0h RA, Dec 0°">♈ 0h/0°</button>
    <button id="storiesBtn" title="Sky Stories: narrated walks through the sky">📖 Stories</button>
    <button id="layersBtn">Layers</button>
    <button id="fsBtn" title="Fullscreen">⛶</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="ov" id="coord"></div>
    <div class="ov" id="tip"></div>
    <div class="ov" id="score"></div>
    <div id="quiz"></div>
    <div id="layers"></div>
    <div id="sel"></div>
    <div id="starinfo"></div>
    <div id="stories"></div>
    <div id="player"></div>
    <div id="recbar"></div>
    <input type="file" id="importFile" accept=".skystory,application/json" hidden>
  </div>
  <div class="credit">Drag to rotate · scroll or pinch to zoom · click to add to your list · data: <a href="https://github.com/ofrohn/d3-celestial" target="_blank" rel="noopener">d3-celestial</a> (Yale BSC, IAU boundaries)</div>
</div>

      ctx.strokeStyle = '#4ade80'; ctx.stroke();
      ctx.beginPath(); st.drawn.forEach(function (d) { if (!off[segKey(d[0], d[1])]) seg(d[0], d[1]); });

  // ---------- quiz ----------
  function pool() {

  function cstat(a) { return stats.c[a] || (stats.c[a] = [0, 0, 0]); }

  function nextQ() {
    st.target = pickTarget(); st.picked = null; st.answered = false; st.hinted = false;

  function answer(c) {
    if (st.answered) return;

    var ok = c === st.target, s = cstat(st.target.abbr);

      st.streak++; s[0]++; s[2]++;

      if (st.hinted) pts = Math.round(pts / 2);

  function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return '&#' + ch.charCodeAt(0) + ';'; }); }

    var q = $('quiz');

    var t = st.target, html = '';
    if (st.mode === 'name') {
      html += '<div class="q">Which constellation is highlighted?</div><div class="opts">';

    } else if (st.mode === 'draw') {
      var r = st.result;

        '<span class="y">' + r.ok + '/' + r.total + ' lines</span>' + (r.wrong ? ' · <span class="n">' + r.wrong + ' extra</span>' : '') +
        (r.missed ? ' · <span style="color:#f2c94c">' + r.missed + ' missing (dashed)</span>' : '') + '</div>';
      else html += '<div class="fb">' + st.drawn.length + ' line' + (st.drawn.length === 1 ? '' : 's') +

    } else {
      html += '<div class="q">Click on <b>' + esc(cname(t)) + '</b></div>';
      if (st.hinted && !st.answered) html += '<div class="fb">Hint: around RA ' + fmtRA(t.lra) + ', Dec ' + fmtDec(t.ldec) + '</div>';
    }
    html += '<div class="fb">';
    if (st.answered && st.mode !== 'draw') {
      var info = '<i>' + esc(cname(t)) + '</i> (' + t.abbr + ', gen. <i>' + esc(t.gen) + '</i>) — RA ' + fmtRA(t.lra) + ', Dec ' + fmtDec(t.ldec);
      if (st.picked === t) html += '<span class="y">✓ Correct!</span> ' + info;
      else if (st.picked) html += '<span class="n">✗ That was <i>' + esc(cname(st.picked)) + '</i>.</span> ' + info;
      else html += info;

    if (!st.answered && st.mode === 'draw') html += '<button data-act="undo">⌫ Undo</button><button data-act="clearDraw">Clear</button>' +
      '<button data-act="check"' + (st.drawn.length ? '' : ' disabled') + '>✓ Check ⏎</button>';
    if (!st.answered && st.mode === 'find') html += '<button data-act="hint">Hint (½ points)</button><button data-act="giveup">Show me</button>';
    if (st.answered) html += '<button data-act="next">Next ⏎</button>';

  }
  function renderScore() {
    if (st.mode === 'explore') { $('score').innerHTML = ''; return; }
    var p = pool(), mastered = p.filter(function (a) { return cstat(a)[2] >= 3; }).length;
    $('score').innerHTML = '<b>' + st.score + '</b> pts' +
      (st.streak ? ' · 🔥 ' + st.streak + (st.streak >= 5 ? ' ×' + Math.min(4, 1 + Math.floor(st.streak / 5)) : '') : '') +
      '<br>best streak ' + (stats.best[st.mode] || 0) +

  $('quiz').addEventListener('click', function (e) {

  });

    else if (st.mode === 'draw' && !st.answered && e.key === 'Enter') { e.preventDefault(); checkDraw(); }
    else if (st.mode === 'draw' && !st.answered && (e.key === 'Backspace' || (e.key === 'z' && (e.ctrlKey || e.metaKey)))) { e.preventDefault(); drawUndo(); }

  // ---------- persistence ----------
  var saveT = 0;

  function renderSel() {

    el.style.display = 'block';

      st.sel.map(function (a) { return '<li data-a="' + a + '">' + esc(cname(CONS[a])) + '<b data-x="' + a + '" title="Remove">×</b></li>'; }).join('') + '</ol>';

  // ---------- sky stories: record narration + constellation cues, play back (local, IndexedDB) ----------
  // story = { id, title, created, duration, audio: Blob, cues: [{ t, sel: [abbr], view }], subs: [{ t0, t1, text }] }
  // Cues are full snapshots, so the state at time t is simply the last cue with cue.t <= t.
  var DB = null, stories = [], rec = null;
  var player = { story: null, audio: null, url: null, active: [], cue: -1, raf: 0, edit: false };
  function db() {

  // view as field of view (not px/rad) so a story plays the same on any screen size
  function viewNow() { return { proj: st.proj, ra0: +st.ra0.toFixed(2), dec0: +st.dec0.toFixed(2), fov: +(W / st.S).toFixed(4) }; }
  function applyView(v) { if (v.proj !== st.proj) setProj(v.proj); flyTo(v.ra0, v.dec0, W / v.fov); }

  // --- recording ---
  function snap() {
    if (!rec || !rec.t0) return;
    var t = +((performance.now() - rec.t0) / 1000).toFixed(2), last = rec.cues[rec.cues.length - 1];
    var c = { t: t, sel: st.sel.slice(), view: viewNow() };

    rec.cues.push(c);
  }
  // the mic stream is kept open between takes, so a retake doesn't ask for permission again
  var mic = null;
  function getMic() {
    if (mic && mic.getTracks().every(function (t) { return t.readyState === 'live'; })) return Promise.resolve(mic);
    return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (m) { return (mic = m); });
  }
  function releaseMic() { if (mic) mic.getTracks().forEach(function (t) { t.stop(); }); mic = null; }
  window.addEventListener('pagehide', releaseMic);
  // replace: a story whose take is redone (keeps id, title and creation date)
  function startRec(replace) {
    if (!navigator.mediaDevices || !window.MediaRecorder) { storyMsg('Recording needs microphone access (open the page via https or as a local file).'); return; }
    var title = replace ? replace.title : prompt('Title of the story', 'Little Ursa and her dragon');
    if (!title) return;
    getMic().then(function (stream) { beginRec(title, stream, replace); },
      function (e) { storyMsg('Microphone not available: ' + e.message); });
  }
  function beginRec(title, stream, replace) {
    closePlayer(); setMode('explore'); $('stories').style.display = 'none';
    rec = { title: title, stream: stream, replace: replace || null, chunks: [], cues: [], t0: 0, keepSel: st.sel, mr: new MediaRecorder(stream) };
    var n = 3, r = rec;
    r.mr.ondataavailable = function (e) { if (e.data.size) r.chunks.push(e.data); };
    st.sel = []; renderSel(); req();
    renderRec(n);
    r.cd = setInterval(function () {
      if (rec !== r) return clearInterval(r.cd);

      clearInterval(r.cd);
      r.mr.start(250); r.t0 = performance.now(); snap(); renderRec();
      r.iv = setInterval(function () { var e = $('recTime'); if (e) e.textContent = fmtT((performance.now() - r.t0) / 1000); }, 250);
    }, 800);
  }
  function renderRec(count) {
    var b = $('recbar'); b.style.display = 'block';
    b.innerHTML = count
      ? '<div class="big">' + count + '</div><div class="hint" style="text-align:center">Talk, click constellations, rotate and zoom – it all gets recorded.</div>'
      : '<div class="ctl"><span class="dot">●</span><b>REC</b><span id="recTime">0:00</span><i class="ttl">' + esc(rec.title) +
        '</i><span class="sp"></span><button data-act="restart" title="Discard this take and start again">↺ Restart</button><button data-act="stop">■ Stop</button></div><div class="hint">Click a constellation to light it up, click again to switch it off.</div>';
  }
  function endRec() {

  function restartRec() {

  function stopRec() {

    r.mr.onstop = function () {

  $('recbar').addEventListener('click', function (e) {

  // --- playback (HTMLAudioElement; an Eduskript build would swap this for Web Audio, CSP blocks media-src) ---
  function repairAudio(s) {

      var u = new Uint8Array(buf), i = 0;
      while (i < u.length - 3 && !(u[i] === 0x1A && u[i + 1] === 0x45 && u[i + 2] === 0xDF && u[i + 3] === 0xA3)) i++;

  }
  function openPlayer(s) { repairAudio(s).then(openPlayer2); }
  function openPlayer2(s) {

    player.story = s; player.url = URL.createObjectURL(s.audio);
    player.audio = new Audio(player.url);
    player.audio.onended = function () { renderCtl(); };

  function closePlayer() {

  }
  function ptime() { return player.audio ? player.audio.currentTime : 0; }

  function cueAt(t) { var c = player.story.cues, i = -1; for (var k = 0; k < c.length; k++) if (c[k].t <= t + 1e-3) i = k; return i; }
  function applyAt(t, force) {

    player.active = c ? c.sel.slice() : [];
    if (c && c.view) applyView(c.view);
    req(); markCue();
  }
  function updTime() {
    var t = ptime(), s = player.story, sub = '';
    $('pTime').textContent = fmtT(t) + ' / ' + fmtT(s.duration);
    if (!seeking) $('pSeek').value = t;
    (s.subs || []).forEach(function (x) { if (x.t0 <= t && t < x.t1) sub = x.text; });
    $('pSub').textContent = sub;
  }
  function renderCtl() { var b = $('pPP'); if (b) b.textContent = player.audio && !player.audio.paused ? '❚❚' : '▶'; }
  function renderPlayer() {
    var s = player.story, el = $('player');
    el.style.display = 'block';
    el.innerHTML = '<div class="sub" id="pSub"></div><div class="ctl"><button id="pPP" data-act="pp">▶</button>' +
      '<span class="ttl">' + esc(s.title) + '</span><div class="seek"><div class="ticks" id="pTicks"></div>' +
      '<input type="range" id="pSeek" min="0" max="' + s.duration + '" step="0.05" value="0"></div>' +
      '<span id="pTime"></span><button data-act="retake" title="Record this story again (replaces this take)">↺ Retake</button>' +

  function renderTicks() {

  // --- fix-up editor: shift/delete cues, toggle constellations at the playhead, correct subtitles ---
  function cname3(a) { return CONS[a] ? cname(CONS[a]) : a; }
  function renderEdit() {
    var s = player.story, el = $('pEdit');
    el.style.display = player.edit ? 'block' : 'none';
    if (!player.edit) return;
    el.innerHTML = '<div class="hint" style="margin:0 0 4px">Click constellations on the map to switch them on/off at the playhead.</div>' +
      s.cues.map(function (c, i) {
        return '<div class="cue" data-i="' + i + '"><span>' + c.t.toFixed(1) + ' s</span><i>' +
          (c.sel.length ? c.sel.map(function (a) { return esc(cname3(a)); }).join(', ') : '—') + '</i>' +
          '<button data-act="nudge" data-d="-0.5">−½ s</button><button data-act="nudge" data-d="0.5">+½ s</button>' +
          '<button data-act="go">▶</button><button data-act="delcue">×</button></div>';
      }).join('') +
      '<div class="ctl" style="margin:4px 0"><button data-act="addcue">+ cue with current view at playhead</button></div>' +
      (s.subs && s.subs.length ? s.subs.map(function (x, i) {

  function saveStory() { player.story.cues.sort(function (a, b) { return a.t - b.t; }); return dbPut(player.story); }
  function cueAtPlayhead() {
    var s = player.story, t = +ptime().toFixed(2), i = cueAt(t), c = s.cues[i];
    if (c && Math.abs(c.t - t) < 0.25) return c;
    c = { t: t, sel: player.active.slice(), view: viewNow() };
    s.cues.push(c); return c;
  }
  function editToggle(a) {
    var c = cueAtPlayhead(), i = c.sel.indexOf(a);
    if (i >= 0) c.sel.splice(i, 1); else c.sel.push(a);
    saveStory(); player.cue = -1; applyAt(ptime()); renderTicks(); renderEdit();
  }
  $('player').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var act = b.dataset.act, row = b.closest('.cue'), s = player.story, i = row ? +row.dataset.i : -1;
    if (act === 'pp') { if (player.audio.paused) playPlayer(); else pausePlayer(); }
    else if (act === 'close') { closePlayer(); releaseMic(); }
    else if (act === 'retake') startRec(s);
    else if (act === 'edit') { player.edit = !player.edit; renderEdit(); }
    else if (act === 'nudge') { s.cues[i].t = Math.max(0, +(s.cues[i].t + +b.dataset.d).toFixed(2)); saveStory(); player.cue = -1; renderTicks(); renderEdit(); }
    else if (act === 'delcue') { s.cues.splice(i, 1); saveStory(); player.cue = -1; applyAt(ptime()); renderTicks(); renderEdit(); }
    else if (act === 'go') { pausePlayer(); player.audio.currentTime = s.cues[i].t; player.cue = -1; applyAt(s.cues[i].t); updTime(); }
    else if (act === 'addcue') { var c = cueAtPlayhead(); c.view = viewNow(); c.sel = player.active.slice(); saveStory(); player.cue = -1; renderTicks(); renderEdit(); }
  });
  $('player').addEventListener('focusout', function (e) {
    var i = e.target.dataset && e.target.dataset.si;
    if (i == null) return;
    player.story.subs[+i].text = e.target.textContent.trim(); saveStory();
  });

  // --- stories list, export/import, Whisper subtitles ---
  function storyMsg(m) { var e = $('stMsg'); if (e) e.textContent = m; else if (m) alert(m); }
  function loadStories() {
    return dbAll().then(function (a) {
      stories = (a || []).sort(function (x, y) { return x.created - y.created; }); renderStories();
    });
  }
  function renderStories() {
    var el = $('stories');
    if (el.style.display !== 'block') return;
    var keep = $('stMsg') ? $('stMsg').textContent : '';
    el.innerHTML = '<div class="hd"><span>📖 Sky Stories</span><button data-act="rec">● Record</button><button data-act="import">Import</button><button data-act="x">✕</button></div>' +
      (stories.length ? '<ol>' + stories.map(function (s) {
        return '<li data-id="' + s.id + '"><span class="t" data-act="play">' + esc(s.title) + '</span> <small>' + fmtT(s.duration) +
          (s.subs && s.subs.length ? ' · CC' : '') + '</small><span class="acts"><b data-act="subs" title="Subtitles with Whisper">CC</b>' +
          '<b data-act="ren" title="Rename">✎</b><b data-act="exp" title="Export as file">⤓</b><b data-act="del" title="Delete">🗑</b></span></li>';
      }).join('') + '</ol>' : '<div class="hint">No stories yet. Press ● Record, then tell your story while you click the constellations.</div>') +
      '<div class="hint" id="stMsg">' + esc(keep) + '</div>';
  }
  $('storiesBtn').addEventListener('click', function () {
    var el = $('stories'), open = el.style.display !== 'block';
    el.style.display = open ? 'block' : 'none';
    renderSel();
    if (open) loadStories().catch(function () { el.innerHTML = '<div class="hint">Stories need browser storage (IndexedDB), which is blocked here.</div>'; });
  });
  $('stories').addEventListener('click', function (e) {
    var act = e.target.dataset.act; if (!act) return;
    var li = e.target.closest('li'), s = li && stories.filter(function (x) { return x.id === li.dataset.id; })[0];
    if (act === 'x') { $('stories').style.display = 'none'; renderSel(); releaseMic(); }
    else if (act === 'rec') startRec();
    else if (act === 'import') $('importFile').click();
    else if (act === 'play') openPlayer(s);
    else if (act === 'ren') { var t = prompt('New title', s.title); if (t) { s.title = t; dbPut(s).then(loadStories); } }
    else if (act === 'del') { if (confirm('Delete "' + s.title + '"?')) dbDel(s.id).then(loadStories); }
    else if (act === 'exp') exportStory(s);
    else if (act === 'subs') transcribe(s);
  });
  function exportStory(s) {
    var fr = new FileReader();
    fr.onload = function () {
      var o = { format: 'skystory', version: 1, id: s.id, title: s.title, created: s.created, duration: s.duration, cues: s.cues, subs: s.subs, audio: fr.result };
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], { type: 'application/json' }));
      a.download = s.title.replace(/[^\w\-]+/g, '_') + '.skystory';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    };
    fr.readAsDataURL(s.audio);
  }
  $('importFile').addEventListener('change', function () {
    var f = this.files[0]; this.value = ''; if (!f) return;
    f.text().then(function (txt) {
      var o = JSON.parse(txt);
      if (o.format !== 'skystory') throw new Error('not a .skystory file');
      return fetch(o.audio).then(function (r) { return r.blob(); }).then(function (blob) {
        return dbPut({ id: o.id || 's' + Date.now(), title: o.title, created: o.created || Date.now(), duration: o.duration,
          audio: blob, cues: o.cues || [], subs: o.subs || [] });
      });
    }).then(loadStories).then(function () { storyMsg('Imported.'); }, function (e) { storyMsg('Import failed: ' + e.message); });
  });

  // Whisper runs in the browser (transformers.js); the model (~150 MB) is cached after the first download
  var asr = null;
  function transcribe(s) {
    storyMsg('Loading Whisper …');
    var load = asr || (asr = import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1').then(function (T) {
      return T.pipeline('automatic-speech-recognition', 'onnx-community/whisper-base', {
        progress_callback: function (p) { if (p.status === 'progress' && /onnx/.test(p.file || '')) storyMsg('Downloading Whisper model … ' + Math.round(p.progress) + ' %'); }
      });
    }));
    load.catch(function () { asr = null; });
    Promise.all([load, s.audio.arrayBuffer()]).then(function (r) {
      storyMsg('Transcribing “' + s.title + '” …');
      var ac = new AudioContext({ sampleRate: 16000 });
      return ac.decodeAudioData(r[1]).then(function (ab) {
        ac.close();
        var opts = { return_timestamps: true, chunk_length_s: 30, stride_length_s: 5 };
        if (st.lang.de && !st.lang.en) opts.language = 'german';
        return r[0](ab.getChannelData(0), opts);
      });
    }).then(function (out) {
      s.subs = (out.chunks || []).map(function (c) {
        return { t0: c.timestamp[0], t1: c.timestamp[1] == null ? s.duration : c.timestamp[1], text: c.text.trim() };
      }).filter(function (x) { return x.text && !/^\[[^\]]*\]$/.test(x.text); });   // drop [BLANK_AUDIO] etc.
      return dbPut(s);
    }).then(function () {
      return loadStories();
    }).then(function () {
      storyMsg('Subtitles ready (' + s.subs.length + ' lines). Fix mistakes with ✎ in the player.');
      if (player.story && player.story.id === s.id) { player.story.subs = s.subs; renderPlayer(); }
    }).catch(function (e) { storyMsg('Whisper failed: ' + (e && e.message || e)); });
  }

  // ---------- UI wiring ----------
  function setSeg(id, v) { [].forEach.call($(id).children, function (b) { b.classList.toggle('on', b.dataset.v === v); }); }
  function setMode(m) {
    $('starinfo').style.display = 'none';
    if (m !== 'explore') { closePlayer(); if (rec) stopRec(); }
    st.mode = m; st.target = null; st.answered = false; st.streak = 0; st.score = 0;
    $('sq').dataset.mode = m; setSeg('modes', m);
    $('tip').style.display = 'none';
    if (m !== 'explore') nextQ(); else { renderQuiz(); req(); }
    renderScore(); renderSel();
  }
  function setProj(p) { st.proj = p; setSeg('projs', p); if (p === 'map') st.dec0 = Math.max(-60, Math.min(60, st.dec0)); if (W) clampS(); req(); }
  $('modes').addEventListener('click', function (e) { if (e.target.dataset.v) setMode(e.target.dataset.v); });
  $('projs').addEventListener('click', function (e) { if (e.target.dataset.v) setProj(e.target.dataset.v); });
  $('level').addEventListener('change', function () { st.level = +this.value; save(); if (st.mode !== 'explore') { st.target = null; nextQ(); } renderScore(); });
  function renderLang() { [].forEach.call($('langs').children, function (b) { b.classList.toggle('on', !!st.lang[b.dataset.lang]); }); }
  $('langs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var k = b.dataset.lang, other = k === 'en' ? 'de' : 'en';
    st.lang[k] = !st.lang[k];
    if (!st.lang[k] && !st.lang[other]) st.lang[other] = true;   // never both off: switching off the last one swaps
    save(); renderLang(); renderQuiz(); renderSel(); req();
  });
  $('recenter').addEventListener('click', function () { flyTo(0, 0, defaultScale()); });

  $('cv').addEventListener('pointerleave', function () { cv.style.cursor = ''; });
  var LAYERS = [['real', 'Realistic stars (brightness + colour)'], ['lines', 'Constellation lines'], ['bounds', 'Boundaries'], ['names', 'Names'], ['stars', 'Stars'],
    ['messier', 'Messier objects'], ['grid', 'RA/Dec grid'], ['mw', 'Milky Way'], ['ecl', 'Ecliptic + months'], ['gal', 'Galactic equator']];
  $('layers').innerHTML = LAYERS.map(function (l) {
    return '<label><input type="checkbox" data-l="' + l[0] + '"' + (st.layers[l[0]] ? ' checked' : '') + '> ' + l[1] + '</label>';
  }).join('');
  $('layers').addEventListener('change', function (e) { st.layers[e.target.dataset.l] = e.target.checked; req(); });
  $('layersBtn').addEventListener('click', function () { var l = $('layers'); l.style.display = l.style.display === 'block' ? 'none' : 'block'; });

  var fsOn = false;
  function setFs(on) { fsOn = on; $('sq').classList.toggle('fs', on); }
  $('fsBtn').addEventListener('click', function () {
    if (plugin && plugin.requestFullscreen) { fsOn ? plugin.exitFullscreen() : plugin.requestFullscreen(); return; }
    if (document.fullscreenElement) document.exitFullscreen();
    else if ($('sq').requestFullscreen) $('sq').requestFullscreen();
  });
  document.addEventListener('fullscreenchange', function () { if (!plugin) setFs(!!document.fullscreenElement); });

  // pointer: drag to rotate, wheel/pinch to zoom, click to answer
  var ptrs = {}, down = null, moved = false, pinch0 = 0, S0 = 0;
  function local(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener('pointerdown', function (e) {
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    $('starinfo').style.display = 'none';
    if (player.story) pausePlayer();
    ptrs[e.pointerId] = local(e);
    var ids = Object.keys(ptrs);
    if (ids.length === 1) { down = ptrs[e.pointerId]; moved = false; }
    if (ids.length === 2) { var a = ptrs[ids[0]], b = ptrs[ids[1]]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); S0 = st.S; moved = true; }
  });
  cv.addEventListener('pointermove', function (e) {
    var p = local(e);
    if (!ptrs[e.pointerId]) { hover(p); return; }
    var prev = ptrs[e.pointerId]; ptrs[e.pointerId] = p;
    var ids = Object.keys(ptrs);
    if (ids.length === 2) {
      var a = ptrs[ids[0]], b = ptrs[ids[1]];
      st.S = S0 * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch0; clampS(); req(); return;
    }
    if (!moved && Math.hypot(p[0] - down[0], p[1] - down[1]) < 5) return;
    if (!moved) { moved = true; cv.classList.add('drag'); }
    cancelAnimationFrame(anim);
    var dx = p[0] - prev[0], dy = p[1] - prev[1], k = 1 / (st.S * D);
    var c = st.proj === 'map' ? 1 : 1 / Math.max(Math.cos(st.dec0 * D), 0.25);
    st.ra0 = norm360(st.ra0 + dx * k * c);
    st.dec0 = Math.max(st.proj === 'map' ? -60 : -90, Math.min(st.proj === 'map' ? 60 : 90, st.dec0 + dy * k));
    hover(p); req();
  });
  function up(e) {
    var p = ptrs[e.pointerId]; delete ptrs[e.pointerId];
    cv.classList.remove('drag');
    if (p && !moved && Object.keys(ptrs).length === 0 && st.mode === 'draw' && st.target && !st.answered) {
      drawClick(starAt(p[0], p[1]));
    } else if (p && !moved && Object.keys(ptrs).length === 0 && st.mode === 'find' && st.target && !st.answered) {
      var s = unproj(p[0], p[1]), c = s && hit(s[0], s[1]);
      if (c) answer(c);
    } else if (p && !moved && Object.keys(ptrs).length === 0 && st.mode === 'explore' && !rec && !player.edit && starAt(p[0], p[1]) >= 0) {
      showStar(starAt(p[0], p[1]), p[0], p[1]);
    } else if (p && !moved && Object.keys(ptrs).length === 0 && st.mode === 'explore') {
      var s2 = unproj(p[0], p[1]), c2 = s2 && hit(s2[0], s2[1]);
      if (c2 && player.story) { if (player.edit) editToggle(c2.abbr); }
      else if (c2) toggleSel(c2.abbr);
    } else if (p && moved && rec) snap();
  }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', function () { $('tip').style.display = 'none'; });
  cv.addEventListener('wheel', function (e) {
    e.preventDefault(); cancelAnimationFrame(anim);
    st.S *= Math.exp(-e.deltaY * 0.0015); clampS(); req();
    if (player.story) pausePlayer();
    if (rec) { clearTimeout(wheelT); wheelT = setTimeout(snap, 250); }
  }, { passive: false });
  var wheelT = 0;

  function hover(p) {
    var s = unproj(p[0], p[1]), tip = $('tip');
    $('coord').textContent = s ? 'RA ' + fmtRA(s[0]) + '   Dec ' + fmtDec(s[1]) : '';
    cv.style.cursor = (st.mode === 'explore' || st.mode === 'draw') && starAt(p[0], p[1]) >= 0 ? 'pointer' : '';
    if (st.mode !== 'explore' || !s) { tip.style.display = 'none'; return; }
    var c = hit(s[0], s[1]);
    if (!c) { tip.style.display = 'none'; return; }
    tip.innerHTML = '<i>' + esc(cname(c)) + '</i> · ' + c.abbr;
    tip.style.display = 'block';
    tip.style.left = Math.min(p[0] + 14, W - tip.offsetWidth - 4) + 'px';
    tip.style.top = (p[1] + 16) + 'px';
  }

  function resize() {
    var r = $('stage').getBoundingClientRect();
    if (!r.width || !r.height) return;
    var first = !W;
    dpr = window.devicePixelRatio || 1; W = r.width; H = r.height; cx = W / 2; cy = H / 2;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    if (first) st.S = defaultScale();
    clampS(); draw();
  }

  function start(cfg) {
    cfg = cfg || {};
    if (+cfg.height) $('sq').style.setProperty('--h', +cfg.height + 'px');
    if (cfg.level != null && cfg.level !== '') st.level = Math.max(0, Math.min(3, +cfg.level || 0));
    if (st.level === 0 && !st.sel.length) st.level = 1;
    if (cfg.lang) { var ls = String(cfg.lang).split(/[ ,]+/); st.lang = { en: ls.indexOf('en') >= 0, de: ls.indexOf('de') >= 0 }; if (!st.lang.de) st.lang.en = true; }
    if (!document.body.classList.contains('standalone') || !window.indexedDB) $('storiesBtn').style.display = 'none';
    renderLang();
    $('level').value = String(st.level);
    setProj(cfg.projection === 'sphere' ? 'sphere' : 'map');
    new ResizeObserver(resize).observe($('stage'));
    resize();
    setMode(['name', 'find', 'draw'].indexOf(cfg.mode) >= 0 ? cfg.mode : 'explore');
  }
  function applyTheme(t) { document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); }

  if (typeof window.eduskript !== 'undefined') {
    plugin = eduskript.init();
    plugin.onReady(function (ctx) { applyTheme(ctx.theme); restore(ctx.data); start(ctx.config); });
    plugin.onThemeChange(applyTheme);
    plugin.onDataChanged(function (d) { restore(d); renderScore(); renderSel(); req(); });
    if (plugin.onFullscreenChange) plugin.onFullscreenChange(setFs);
  } else {
    try { restore(JSON.parse(localStorage.getItem('sky-quiz'))); } catch (e) {}
    var q = {}; location.search.replace(/[?&]([^=&]+)=([^&]*)/g, function (_, k, v) { q[k] = decodeURIComponent(v); });
    start(q);
    if (q.debug) window.__sky = { st: st, CONS: CONS, proj: proj, segsOf: segsOf, SKY: SKY };   // test hook
  }
})();
</script>

</body></html>
