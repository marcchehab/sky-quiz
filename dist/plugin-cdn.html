<!--
  Constellation Trainer — drag/zoom star map with three modes:
    explore : hover shows constellation, all labels on
    name    : a highlighted constellation is shown, pick its name (keys 1–4)
    find    : a name is given, click the constellation on the map
  Runs as an Eduskript plugin (feature-detects window.eduskript) or as a standalone page.

  Config attributes on <plugin>:
    mode       = explore | name | find | draw   (default explore)
    level      = 1 | 2 | 3                  (1 = 22 famous, 2 = 46, 3 = all 88; default 1)
    projection = map | sphere               (default map)
    height     = px                         (inline height, default 560)
    lang       = en | de | en,de             (constellation names; default en)

  Sky data: d3-celestial by Olaf Frohn (BSD-3-Clause) — Yale BSC stars to mag 6,
  IAU constellation boundaries, Milky Way outlines.
-->
<style>
  :root {
    --bg: #ffffff; --fg: #1f2937; --muted: #6b7280; --line: #d1d5db; --panel: #f3f4f6;
    --accent: #2563eb; --ok: #16a34a; --bad: #dc2626;
  }
  html[data-theme="dark"] {
    --bg: #111827; --fg: #e5e7eb; --muted: #9ca3af; --line: #374151; --panel: #1f2937;
    --accent: #60a5fa; --ok: #4ade80; --bad: #f87171;
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) body.standalone {
      --bg: #111827; --fg: #e5e7eb; --muted: #9ca3af; --line: #374151; --panel: #1f2937;
      --accent: #60a5fa; --ok: #4ade80; --bad: #f87171;
    }
  }
  html { overflow: hidden; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  #sq { display: flex; flex-direction: column; padding: 8px; gap: 6px; }
  body.standalone #sq, #sq.fs { height: 100vh; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .bar .sp { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  button, select {
    font: inherit; font-size: 13px; padding: 4px 10px; cursor: pointer; color: var(--fg);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  }
  .seg button { border: 0; border-radius: 0; border-left: 1px solid var(--line); }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  body:not(.standalone) #sq:not(.fs) .stage { flex: none; height: var(--h, 560px); }
  .stage { position: relative; flex: 1; min-height: 300px; border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden; background: #08093d; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  #sq[data-mode="find"] canvas { cursor: crosshair; }
  #quiz .score-big { font-size: 22px; font-weight: bold; color: #f2c94c; }
  .ov { position: absolute; color: #e8eaf6; font-size: 12px; pointer-events: none;
    text-shadow: 0 1px 2px #000; }
  #coord { left: 8px; bottom: 6px; font-variant-numeric: tabular-nums; }
  #tip { display: none; background: rgba(8,9,40,.9); border: 1px solid #8c7a2e; border-radius: 5px;
    padding: 3px 7px; font-size: 13px; }
  #tip i { color: #b8bdd8; }
  #score { right: 8px; top: 6px; text-align: right; font-size: 13px; line-height: 1.5; }
  #score b { font-size: 16px; }
  #score .meter { width: 140px; height: 5px; background: rgba(255,255,255,.18); border-radius: 3px;
    margin-left: auto; overflow: hidden; }
  #score .meter div { height: 100%; background: #d9a520; width: 0; transition: width .4s; }
  #quiz { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    width: min(560px, calc(100% - 16px)); background: rgba(8,9,40,.88); border: 1px solid #8c7a2e;
    border-radius: 10px; padding: 10px 12px; color: #e8eaf6; display: none; text-align: center; }
  #quiz .q { font-size: 15px; margin-bottom: 8px; }
  #quiz .q b { color: #f2c94c; font-size: 18px; font-style: italic; }
  #quiz .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #quiz button { background: #1b1e5e; color: #e8eaf6; border-color: #3a3f8f; padding: 7px 8px; font-style: italic; }
  #quiz button:hover { background: #262a7a; }
  #quiz button.ok { background: #1e7a3a; border-color: #4ade80; }
  #quiz button.bad { background: #8a2222; border-color: #f87171; }
  #quiz button kbd { font-style: normal; opacity: .55; font-size: 11px; margin-right: 6px; }
  #quiz .fb { min-height: 20px; margin-top: 6px; font-size: 13px; }
  #quiz .fb .y { color: #4ade80; } #quiz .fb .n { color: #f87171; }
  #quiz .row { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
  #quiz .row button { font-style: normal; }
  #layers { position: absolute; right: 8px; top: 8px; display: none; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; z-index: 5; font-size: 13px; }
  #layers label { display: block; cursor: pointer; white-space: nowrap; }
  #sel { position: absolute; left: 8px; top: 8px; max-height: calc(100% - 40px); overflow-y: auto;
    background: rgba(8,9,40,.85); border: 1px solid #8c7a2e; border-radius: 8px; padding: 6px 4px 6px 10px;
    color: #e8eaf6; font-size: 13px; display: none; min-width: 150px; }
  #sel .hd { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; color: #f2c94c; }
  #sel .hd span { flex: 1; }
  #sel ol { margin: 0; padding-left: 22px; }
  #sel li { cursor: pointer; font-style: italic; padding: 1px 0; }
  #sel li:hover { color: #f2c94c; }
  #sel li b { font-style: normal; opacity: .5; margin-left: 6px; padding: 0 3px; }
  #sel li b:hover { opacity: 1; color: #f87171; }
  #sel button { font-size: 11px; padding: 1px 6px; background: #1b1e5e; color: #e8eaf6; border-color: #3a3f8f; }
  #storybox { position: absolute; left: 8px; top: 8px; max-height: calc(100% - 110px); overflow-y: auto;
    background: rgba(8,9,40,.92); border: 1px solid #8c7a2e; border-radius: 10px; padding: 10px 12px;
    color: #e8eaf6; font-size: 14px; display: none; width: min(330px, calc(100% - 16px)); z-index: 4; }
  #storybox .item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: 4px 0; border-radius: 7px;
    border: 1px solid #2b3070; cursor: pointer; }
  #storybox .item:hover { border-color: #f2c94c; }
  #storybox .item .pl { width: 30px; height: 30px; border-radius: 50%; background: #f2c94c; color: #08093d; font-size: 13px;
    display: flex; align-items: center; justify-content: center; flex: none; }
  #storybox .item .t { flex: 1; font-style: italic; }
  #storybox .item small { opacity: .7; white-space: nowrap; }
  #storybox .item .sc { font-weight: bold; white-space: nowrap; }
  #storybox .acts { display: block; font-size: 11px; }
  #storybox .acts b { cursor: pointer; opacity: .6; margin-right: 8px; font-weight: normal; }
  #storybox .acts b:hover { opacity: 1; color: #f2c94c; }
  #storybox .hd { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; color: #f2c94c; font-weight: bold; }
  #storybox .hd span { flex: 1; }
  #storybox ol { margin: 0; padding-left: 20px; }
  #storybox li { padding: 3px 0; }
  #storybox li .t { cursor: pointer; font-style: italic; }
  #storybox li .t:hover { color: #f2c94c; }
  #storybox li small { opacity: .6; }
  #storybox li .acts { float: right; }
  #storybox li .acts b { cursor: pointer; opacity: .6; margin-left: 6px; font-weight: normal; font-size: 12px; }
  #storybox li .acts b:hover { opacity: 1; color: #f2c94c; }
  .hint { font-size: 12px; opacity: .7; margin-top: 4px; }
  #player, #recbar { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    width: min(680px, calc(100% - 16px)); background: rgba(8,9,40,.9); border: 1px solid #8c7a2e;
    border-radius: 10px; padding: 8px 12px; color: #e8eaf6; display: none; z-index: 3; }
  #player .sub { min-height: 1.5em; font-size: 17px; text-align: center; margin-bottom: 6px; }
  .ctl { display: flex; align-items: center; gap: 8px; }
  .ctl .sp { flex: 1; }
  #player .ttl { font-style: italic; color: #f2c94c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30%; }
  #player .seek { position: relative; flex: 1; }
  #player .seek input { width: 100%; display: block; }
  #player .ticks { position: absolute; left: 8px; right: 8px; top: -5px; height: 6px; pointer-events: none; }
  #player .ticks i { position: absolute; width: 2px; height: 6px; background: #f2c94c; }
  #player .ticks i.on { background: #4ade80; }
  #pTime { font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
  #player button, #recbar button, #storybox button { font-size: 12px; padding: 2px 8px; background: #1b1e5e;
    color: #e8eaf6; border-color: #3a3f8f; }
  #pEdit { display: none; max-height: 300px; overflow-y: auto; font-size: 12px; margin-top: 6px;
    border-top: 1px solid #3a3f8f; padding-top: 6px; }
  #pEdit .cue { display: flex; gap: 6px; align-items: center; padding: 1px 0; }
  #pEdit .cue.on { color: #4ade80; }
  #pEdit .cue i { flex: 1; }
  #pEdit .sl { display: flex; gap: 6px; }
  #pEdit .sl [contenteditable] { flex: 1; outline: none; border-bottom: 1px dotted #3a3f8f; }
  #pEdit h4 { margin: 8px 0 2px; font-size: 12px; color: #f2c94c; }
  #pEdit .gen { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  #pEdit .gen input { flex: 1; min-width: 0; font-size: 12px; background: #0b0d33; color: #e8eaf6; border: 1px solid #3a3f8f; padding: 2px 4px; }
  #pEdit .thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
  #pEdit .thumbs img { width: 90px; height: 90px; cursor: pointer; border: 2px solid #3a3f8f; }
  #pEdit .thumbs img:hover { border-color: #f2c94c; }
  #recbar .big { font-size: 42px; text-align: center; color: #f87171; line-height: 1.1; }
  #recbar .dot { color: #f87171; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  #langs button { display: inline-flex; align-items: center; padding: 4px 8px; }
  #langs button svg { display: block; border-radius: 2px; }
  #langs button:not(.on) svg { opacity: .35; filter: grayscale(1); }
  #langs button.on { background: var(--panel); box-shadow: inset 0 -2px 0 var(--accent); color: var(--fg); }
  #starinfo { position: absolute; display: none; background: rgba(8,9,40,.92); border: 1px solid #8c7a2e;
    border-radius: 6px; padding: 5px 9px; color: #e8eaf6; font-size: 13px; pointer-events: none; z-index: 2; line-height: 1.45; }
  #starinfo b { color: #f2c94c; font-size: 14px; }
  #starinfo .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
  .credit { font-size: 11px; color: var(--muted); }
  .credit a { color: inherit; }
</style>

<div id="sq" data-mode="explore">
  <div class="bar">
    <div class="seg" id="modes">
      <button data-v="stories">📖 Sky Stories</button><button data-v="explore">Explore freely</button><button data-v="name">Name it</button><button data-v="find">Find it</button><button data-v="draw">Draw it</button>
    </div>
    <select id="level" title="Which constellations are quizzed">
      <option value="0">My list</option><option value="1">Famous 22</option><option value="2">Common 46</option><option value="3">All 88</option>
    </select>
    <div class="seg" id="projs">
      <button data-v="map" title="Rectangular RA/Dec chart">Chart</button><button data-v="sphere" title="Stereographic view, drag to rotate">Sphere</button>
    </div>
    <span class="sp"></span>
    <div class="seg" id="langs" title="Constellation names: English (Latin) / Deutsch">
      <button data-lang="en" title="English"><svg viewBox="0 0 60 30" width="24" height="12"><rect width="60" height="30" fill="#012169"/><path d="M0,0 60,30M60,0 0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 60,30M60,0 0,30" stroke="#C8102E" stroke-width="2"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg></button><button data-lang="de" title="Deutsch"><svg viewBox="0 0 32 32" width="14" height="14"><rect width="32" height="32" fill="#d52b1e"/><path d="M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z" fill="#fff"/></svg></button>
    </div>
    <button id="recenter" title="Centre on 0h RA, Dec 0°">♈ 0h/0°</button>
    <button id="layersBtn">Layers</button>
    <button id="fsBtn" title="Fullscreen">⛶</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="ov" id="coord"></div>
    <div class="ov" id="tip"></div>
    <div class="ov" id="score"></div>
    <div id="quiz"></div>
    <div id="layers"></div>
    <div id="sel"></div>
    <div id="starinfo"></div>
    <div id="storybox"></div>
    <div id="player"></div>
    <div id="recbar"></div>
    <input type="file" id="importFile" accept=".skystory,application/json" hidden>
    <input type="file" id="sfxFile" accept="audio/*" hidden>
  </div>
  <div class="credit">Drag to rotate · scroll or pinch to zoom · click to add to your list · data: <a href="https://github.com/ofrohn/d3-celestial" target="_blank" rel="noopener">d3-celestial</a> (Yale BSC, IAU boundaries)</div>
</div>

<script src="https://cdn.jsdelivr.net/gh/marcchehab/sky-quiz@v1.2.0/dist/sky-data.js"></script>
<script>
(function () {
  var SKY = window.SKY_DATA;
  var D = Math.PI / 180;

  var COL = {
    bg: '#08093d', grid: 'rgba(170,180,215,.38)', bound: '#8c7a2e', line: '#2f9a45',
    lineHi: '#8dff7a', gal: '#2fc463', equ: '#d03aa8', ecl: '#d9a520', star: '#ffffff',
    messier: '#2cc8e8', name: '#dfe3f2', target: 'rgba(242,201,76,.20)', targetEdge: '#f2c94c',
    okFill: 'rgba(74,222,128,.25)', badFill: 'rgba(248,113,113,.28)'
  };
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // ---------- state ----------
  var st = {
    mode: 'explore', level: 1, proj: 'map', ra0: 0, dec0: 0, S: 0,
    layers: { real: true, lines: true, bounds: true, names: true, stars: true, messier: true, grid: true, mw: true, ecl: true, gal: true },
    target: null, picked: null, answered: false, hinted: false, opts: null,
    drawn: [], drawFrom: -1, result: null, drawSet: null,   // drawSet: { title, list, i, res } after a story   // draw mode: user segments [starA, starB], chain start, check result
    score: 0, streak: 0, lang: { en: true, de: false }, sel: []   // sel: constellation abbrs in the order they were picked
  };
  var stats = { best: { name: 0, find: 0, draw: 0 }, c: {} };   // c[abbr] = [right, wrong, run]
  var W = 0, H = 0, dpr = 1, cx = 0, cy = 0;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var $ = function (id) { return document.getElementById(id); };
  var plugin = null;

  // ---------- data prep ----------
  function wrap180(a) { a = (a + 180) % 360; if (a < 0) a += 360; return a - 180; }
  function norm360(a) { a %= 360; return a < 0 ? a + 360 : a; }

  // interpolate a flat [ra,dec,...] polyline so no step exceeds `step` degrees
  function densify(f, step, closed) {
    var out = [], n = f.length / 2, last = closed ? n : n - 1;
    for (var i = 0; i < last; i++) {
      var a0 = f[2 * i], d0 = f[2 * i + 1], j = (i + 1) % n;
      var da = wrap180(f[2 * j] - a0), dd = f[2 * j + 1] - d0;
      var k = Math.max(1, Math.ceil(Math.max(Math.abs(da) * Math.cos(Math.min(Math.abs(d0), 80) * D), Math.abs(dd)) / step));
      for (var t = 0; t < k; t++) out.push(norm360(a0 + da * t / k), d0 + dd * t / k);
    }
    if (!closed) out.push(f[f.length - 2], f[f.length - 1]);
    return out;
  }

  // great-circle interpolation, for star-to-star figure lines (boundaries stay on RA/Dec lines)
  function densifyGC(f, step) {
    var out = [];
    function vec(i) { var a = f[i] * D, d = f[i + 1] * D; return [Math.cos(d) * Math.cos(a), Math.cos(d) * Math.sin(a), Math.sin(d)]; }
    for (var i = 0; i < f.length - 2; i += 2) {
      var u = vec(i), v = vec(i + 2), w = Math.acos(Math.min(1, u[0] * v[0] + u[1] * v[1] + u[2] * v[2]));
      var k = Math.max(1, Math.ceil(w / D / step)), sw = Math.sin(w);
      for (var t = 0; t < k; t++) {
        if (sw < 1e-9) { out.push(f[i], f[i + 1]); continue; }
        var a = Math.sin((1 - t / k) * w) / sw, b = Math.sin(t / k * w) / sw;
        var x = a * u[0] + b * v[0], y = a * u[1] + b * v[1], z = a * u[2] + b * v[2];
        out.push(norm360(Math.atan2(y, x) / D), Math.asin(Math.max(-1, Math.min(1, z))) / D);
      }
    }
    out.push(f[f.length - 2], f[f.length - 1]);
    return out;
  }

  // star colour from the B-V index, interpolated in a blackbody colour table
  var BV = [[-0.4, 155, 178, 255], [-0.2, 170, 191, 255], [0, 202, 215, 255], [0.3, 248, 247, 255], [0.6, 255, 244, 234],
    [0.9, 255, 228, 196], [1.2, 255, 210, 161], [1.6, 255, 190, 120], [2.0, 255, 170, 90]];
  function bvRGB(bv) {
    for (var i = 1; i < BV.length; i++) if (bv <= BV[i][0] || i === BV.length - 1) {
      var a = BV[i - 1], b = BV[i], t = Math.max(0, Math.min(1, (bv - a[0]) / (b[0] - a[0])));
      return [0, 1, 2].map(function (k) { return Math.round(a[k + 1] + (b[k + 1] - a[k + 1]) * t); }).join(',');
    }
  }
  var SCOL = [];
  for (var si = 0; si < SKY.s.length; si += 4) SCOL.push(bvRGB(SKY.s[si + 3]));

  var CONS = {}, ABBR = [];
  Object.keys(SKY.c).forEach(function (a) {
    var c = SKY.c[a];
    CONS[a] = {
      abbr: a, name: c[0], gen: c[1], rank: c[2], lra: c[3], ldec: c[4], de: c[5] || c[0], nb: SKY.nb[a] || [],
      lines: (SKY.l[a] || []).map(function (l) { return densifyGC(l, 2); }),
      polys: (SKY.b[a] || []).map(function (p) { return densify(p, 1.5, true); })
    };
    ABBR.push(a);
  });
  // Milky Way: rasterise the contour rings once into an equirectangular brightness map (fill is
  // unambiguous there), then sample it per screen block. Filling the rings directly in the
  // stereographic view inverts whenever a ring wraps behind the viewer.
  var MWW = 1440, MWH = 720, MWA = (function () {
    var c = document.createElement('canvas'); c.width = MWW; c.height = MWH;
    var g = c.getContext('2d'), kx = MWW / 360, ky = MWH / 180;
    g.fillStyle = 'rgba(255,255,255,.11)';
    SKY.mw.forEach(function (lvl) {
      // rings that run all the way round the sky (the band's two edges) must be closed via the
      // same pole, so that even-odd filling leaves exactly the strip between them
      var rings = lvl.map(function (r) {
        var f = densify(r, 3, true), u = f[0], prev = f[0], pts = [u, f[1]], sumD = 0;
        for (var i = 2; i < f.length; i += 2) { u += wrap180(f[i] - prev); prev = f[i]; pts.push(u, f[i + 1]); sumD += f[i + 1]; }
        u += wrap180(f[0] - prev);
        return { pts: pts, end: u, wraps: Math.abs(u - f[0]) > 180, north: sumD > 0 };
      });
      var nWrap = rings.filter(function (r) { return r.wraps; }).length;
      g.beginPath();
      rings.forEach(function (r) {
        var pts = r.pts;
        if (r.wraps) { var pole = nWrap % 2 === 0 || r.north ? 90 : -90; pts.push(r.end, pole, pts[0], pole); }
        for (var off = -360; off <= 360; off += 360) {
          for (var j = 0; j < pts.length; j += 2) {
            var X = (pts[j] + off) * kx, Y = (90 - pts[j + 1]) * ky;
            if (j) g.lineTo(X, Y); else g.moveTo(X, Y);
          }
          g.closePath();
        }
      });
      g.fill('evenodd');
    });
    var d = g.getImageData(0, 0, MWW, MWH).data, a = new Uint8Array(MWW * MWH);
    for (var i = 0; i < a.length; i++) a[i] = d[4 * i + 3];
    return a;
  })();
  var MWB = 4, mwCv = document.createElement('canvas'), mwCtx = mwCv.getContext('2d'), mwImg = null;
  function drawMW() {
    var w = Math.ceil(W / MWB), h = Math.ceil(H / MWB);
    if (!mwImg || mwImg.width !== w || mwImg.height !== h) { mwCv.width = w; mwCv.height = h; mwImg = mwCtx.createImageData(w, h); }
    var px = mwImg.data;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var s = unproj((x + .5) * MWB, (y + .5) * MWB), o = 4 * (y * w + x), v = 0;
      if (s) v = MWA[Math.min(MWH - 1, Math.floor((90 - s[1]) * MWH / 180)) * MWW + Math.floor(s[0] * MWW / 360) % MWW];

      if (!st.drawn.some(function (d) { return segKey(d[0], d[1]) === k; })) st.drawn.push([st.drawFrom, n]);
    }
    st.drawFrom = n; renderQuiz(); req();
  }
  function drawUndo() {
    var d = st.drawn.pop();
    st.drawFrom = d ? d[0] : -1; renderQuiz(); req();
  }
  function checkDraw() {
    if (st.answered || !st.drawn.length) return;
    var off = segsOf(st.target), keys = Object.keys(off), mine = {}, ok = 0, wrong = 0;
    st.drawn.forEach(function (d) { var k = segKey(d[0], d[1]); mine[k] = 1; if (off[k]) ok++; else wrong++; });
    var pct = ok / Math.max(1, keys.length + wrong);
    st.result = { ok: ok, wrong: wrong, missed: keys.filter(function (k) { return !mine[k]; }).length, total: keys.length, pct: pct, mine: mine };
    st.answered = true; st.drawFrom = -1;
    var s = cstat(st.target.abbr), good = pct >= 0.8;
    if (good) { st.streak++; s[0]++; s[2]++; if (st.streak > (stats.best.draw || 0)) stats.best.draw = st.streak; }
    else { st.streak = 0; s[1]++; s[2] = 0; }
    st.score += Math.round(20 * pct) * Math.min(4, 1 + Math.floor(Math.max(0, st.streak - 1) / 5));
    if (st.drawSet) { st.drawSet.res.push(pct); st.drawSet.i++; }
    save(); renderQuiz(); renderScore(); req();
  }
  function drawDrawing() {
    var s = SKY.s;
    function seg(a, b) {
      var p = proj(s[4 * a], s[4 * a + 1]), q = proj(s[4 * b], s[4 * b + 1]);
      if (p && q) { ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); }
    }
    if (st.answered && st.result) {
      var off = segsOf(st.target), mine = st.result.mine;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.setLineDash([6, 5]);
      Object.keys(off).forEach(function (k) { if (!mine[k]) seg(off[k][0], off[k][1]); });
      ctx.strokeStyle = '#f2c94c'; ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); st.drawn.forEach(function (d) { if (off[segKey(d[0], d[1])]) seg(d[0], d[1]); });
      ctx.strokeStyle = '#4ade80'; ctx.stroke();
      ctx.beginPath(); st.drawn.forEach(function (d) { if (!off[segKey(d[0], d[1])]) seg(d[0], d[1]); });
      ctx.strokeStyle = '#f87171'; ctx.stroke();
      return;
    }
    ctx.beginPath(); st.drawn.forEach(function (d) { seg(d[0], d[1]); });
    ctx.strokeStyle = '#8fd3ff'; ctx.lineWidth = 2.2; ctx.stroke();
    if (st.drawFrom >= 0) {
      var p = proj(s[4 * st.drawFrom], s[4 * st.drawFrom + 1]);
      if (p) { ctx.beginPath(); ctx.arc(p[0], p[1], 8, 0, 7); ctx.strokeStyle = '#8fd3ff'; ctx.lineWidth = 1.5; ctx.stroke(); }
    }
  }

  // ---------- quiz ----------
  function pool() {
    if (st.level === 0 && st.sel.length) return st.sel.slice();
    return ABBR.filter(function (a) { return CONS[a].rank <= Math.max(1, st.level); });
  }
  function cstat(a) { return stats.c[a] || (stats.c[a] = [0, 0, 0]); }
  function pickTarget() {
    var p = pool(), w = p.map(function (a) {
      var s = cstat(a);
      return (st.target && st.target.abbr === a) ? 0 : (1 + Math.min(s[1], 3)) / (1 + 2 * s[2]);
    });
    var tot = w.reduce(function (x, y) { return x + y; }, 0), r = Math.random() * tot;
    for (var i = 0; i < p.length; i++) { r -= w[i]; if (r <= 0) return CONS[p[i]]; }
    return CONS[p[p.length - 1]];
  }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function makeOptions(t) {
    var p = pool(), nb = shuffle(t.nb.slice()).slice(0, 2), o = [t.abbr].concat(nb);
    shuffle(p.slice()).concat(shuffle(ABBR.slice())).forEach(function (a) { if (o.length < 4 && o.indexOf(a) < 0) o.push(a); });
    return shuffle(o).map(function (a) { return CONS[a]; });
  }
  function fmtRA(ra) { var m = Math.round(ra / 15 * 60); return Math.floor(m / 60) % 24 + 'h ' + ('0' + m % 60).slice(-2) + 'm'; }
  function fmtDec(d) { var m = Math.round(Math.abs(d) * 60); return (d < 0 ? '−' : '+') + Math.floor(m / 60) + '° ' + ('0' + m % 60).slice(-2) + '′'; }

  function nextQ() {
    var ds = st.mode === 'draw' && st.drawSet;
    if (ds && ds.i >= ds.list.length) {
      ds.done = true; st.target = null;
      stats.stories = stats.stories || {};   // last score per story -> colour in the Sky Stories list
      stats.stories[ds.story.id] = ds.res.reduce(function (x, y) { return x + y; }, 0) / ds.res.length;
      save(); renderQuiz(); req(); return;
    }
    st.target = ds ? CONS[ds.list[ds.i]] : pickTarget(); st.picked = null; st.answered = false; st.hinted = false;
    st.drawn = []; st.drawFrom = -1; st.result = null;
    if (st.mode === 'name' || st.mode === 'draw') {
      if (st.mode === 'name') st.opts = makeOptions(st.target);
      flyTo(st.target.lra, st.target.ldec, fitScale(st.target));
    }
    renderQuiz(); req();
  }
  function answer(c) {
    if (st.answered) return;
    st.answered = true; st.picked = c;
    var ok = c === st.target, s = cstat(st.target.abbr);
    if (ok) {
      st.streak++; s[0]++; s[2]++;
      var pts = (st.mode === 'find' ? 15 : 10) * Math.min(4, 1 + Math.floor((st.streak - 1) / 5));
      if (st.hinted) pts = Math.round(pts / 2);
      st.score += pts;
      if (st.streak > (stats.best[st.mode] || 0)) stats.best[st.mode] = st.streak;
    } else {
      st.streak = 0; s[1]++; s[2] = 0;
      if (st.mode === 'find') flyTo(st.target.lra, st.target.ldec);
    }
    save(); renderQuiz(); renderScore(); req();
    if (ok) setTimeout(function () { if (st.answered && st.picked === c) nextQ(); }, st.mode === 'find' ? 1300 : 1000);
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return '&#' + ch.charCodeAt(0) + ';'; }); }
  function renderQuiz() {
    var q = $('quiz'), ds = st.drawSet;
    if (st.mode === 'draw' && ds && ds.done) {
      var avg = ds.res.reduce(function (x, y) { return x + y; }, 0) / ds.res.length;
      q.style.display = 'block';
      q.innerHTML = '<div class="q">Story <b>' + esc(ds.title) + '</b> drawn from memory</div>' +
        '<div class="score-big">' + Math.round(100 * avg) + ' %</div><div class="fb">' +
        ds.list.map(function (a, i) {
          var r = ds.res[i];
          return '<span class="' + (r >= 0.8 ? 'y' : 'n') + '">' + esc(cname(CONS[a])) + ' ' + Math.round(100 * r) + ' %</span>';
        }).join(' · ') + '</div><div class="row"><button data-act="setagain">↺ Again</button>' +
        '<button data-act="setstory">▶ Story</button><button data-act="setfree">Free drawing</button></div>';
      return;
    }
    if (!isQuiz(st.mode) || !st.target) { q.style.display = 'none'; return; }
    q.style.display = 'block';
    var t = st.target, html = '';
    if (st.mode === 'name') {
      html += '<div class="q">Which constellation is highlighted?</div><div class="opts">';
      st.opts.forEach(function (o, i) {
        var cls = st.answered ? (o === t ? 'ok' : (o === st.picked ? 'bad' : '')) : '';
        html += '<button data-a="' + o.abbr + '" class="' + cls + '"><kbd>' + (i + 1) + '</kbd>' + esc(cname(o)) + '</button>';
      });
      html += '</div>';
    } else if (st.mode === 'draw') {
      var r = st.result;
      html += (ds ? '<div class="hint" style="margin:0">Story “' + esc(ds.title) + '” · ' + Math.min(ds.i + (st.answered ? 0 : 1), ds.list.length) + '/' + ds.list.length + '</div>' : '') +
        '<div class="q">Draw <b>' + esc(cname(t)) + '</b> – click star to star</div>';
      if (r) html += '<div class="fb"><span class="score-big">' + Math.round(100 * r.pct) + ' %</span> &nbsp;' +
        '<span class="y">' + r.ok + '/' + r.total + ' lines</span>' + (r.wrong ? ' · <span class="n">' + r.wrong + ' extra</span>' : '') +
        (r.missed ? ' · <span style="color:#f2c94c">' + r.missed + ' missing (dashed)</span>' : '') + '</div>';
      else html += '<div class="fb">' + st.drawn.length + ' line' + (st.drawn.length === 1 ? '' : 's') +
        ' · click empty sky to start a new chain · ⌫ undo</div>';
    } else {
      html += '<div class="q">Click on <b>' + esc(cname(t)) + '</b></div>';
      if (st.hinted && !st.answered) html += '<div class="fb">Hint: around RA ' + fmtRA(t.lra) + ', Dec ' + fmtDec(t.ldec) + '</div>';
    }
    html += '<div class="fb">';
    if (st.answered && st.mode !== 'draw') {
      var info = '<i>' + esc(cname(t)) + '</i> (' + t.abbr + ', gen. <i>' + esc(t.gen) + '</i>) — RA ' + fmtRA(t.lra) + ', Dec ' + fmtDec(t.ldec);
      if (st.picked === t) html += '<span class="y">✓ Correct!</span> ' + info;
      else if (st.picked) html += '<span class="n">✗ That was <i>' + esc(cname(st.picked)) + '</i>.</span> ' + info;
      else html += info;
    }
    html += '</div><div class="row">';
    if (!st.answered && st.mode === 'draw') html += '<button data-act="undo">⌫ Undo</button><button data-act="clearDraw">Clear</button>' +
      '<button data-act="check"' + (st.drawn.length ? '' : ' disabled') + '>✓ Check ⏎</button>';
    if (!st.answered && st.mode === 'find') html += '<button data-act="hint">Hint (½ points)</button><button data-act="giveup">Show me</button>';
    if (st.answered) html += '<button data-act="next">Next ⏎</button>';
    q.innerHTML = html + '</div>';
  }
  function renderScore() {
    if (!isQuiz(st.mode)) { $('score').innerHTML = ''; return; }
    var p = pool(), mastered = p.filter(function (a) { return cstat(a)[2] >= 3; }).length;
    $('score').innerHTML = '<b>' + st.score + '</b> pts' +
      (st.streak ? ' · 🔥 ' + st.streak + (st.streak >= 5 ? ' ×' + Math.min(4, 1 + Math.floor(st.streak / 5)) : '') : '') +
      '<br>best streak ' + (stats.best[st.mode] || 0) +
      '<br>mastered ' + mastered + '/' + p.length + '<div class="meter"><div style="width:' + (100 * mastered / p.length) + '%"></div></div>';
  }
  $('quiz').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a) answer(CONS[b.dataset.a]);
    else if (b.dataset.act === 'next') nextQ();
    else if (b.dataset.act === 'hint') { st.hinted = true; renderQuiz(); }
    else if (b.dataset.act === 'undo') drawUndo();
    else if (b.dataset.act === 'clearDraw') { st.drawn = []; st.drawFrom = -1; renderQuiz(); req(); }
    else if (b.dataset.act === 'check') checkDraw();
    else if (b.dataset.act === 'setagain') { st.drawSet = { title: st.drawSet.title, list: st.drawSet.list, i: 0, res: [], story: st.drawSet.story }; setMode('draw', true); }
    else if (b.dataset.act === 'setstory') openPlayer(st.drawSet.story);
    else if (b.dataset.act === 'setfree') setMode('draw');
    else if (b.dataset.act === 'giveup') { st.picked = null; st.answered = true; st.streak = 0; cstat(st.target.abbr)[1]++; cstat(st.target.abbr)[2] = 0; save(); flyTo(st.target.lra, st.target.ldec); renderQuiz(); renderScore(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'SELECT') return;
    if (st.mode === 'name' && !st.answered && st.opts && e.key >= '1' && e.key <= '4') answer(st.opts[+e.key - 1]);
    else if (st.mode === 'draw' && !st.answered && e.key === 'Enter') { e.preventDefault(); checkDraw(); }
    else if (st.mode === 'draw' && !st.answered && (e.key === 'Backspace' || (e.key === 'z' && (e.ctrlKey || e.metaKey)))) { e.preventDefault(); drawUndo(); }
    else if (st.answered && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextQ(); }
  });

  // ---------- persistence ----------
  var saveT = 0;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      var payload = { stats: stats, level: st.level, sel: st.sel, lang: st.lang, updatedAt: Date.now() };
      if (plugin) plugin.setData(payload);
      else try { localStorage.setItem('sky-quiz', JSON.stringify(payload)); } catch (e) {}
    }, 700);
  }
  function restore(d) {
    if (d && d.stats && d.stats.c) { stats = d.stats; stats.best = stats.best || { name: 0, find: 0 }; }
    if (d && d.level != null) st.level = d.level;
    if (d && d.lang && (d.lang.en || d.lang.de)) st.lang = { en: !!d.lang.en, de: !!d.lang.de };
    if (d && d.sel) st.sel = d.sel.filter(function (a) { return CONS[a]; });
  }

  function toggleSel(a) {
    var i = st.sel.indexOf(a);
    if (i >= 0) st.sel.splice(i, 1); else st.sel.push(a);
    if (rec) snap(); else save();
    renderSel(); req();
  }
  function renderSel() {
    var el = $('sel'), n = st.sel.length;
    $('level').options[0].textContent = 'My list (' + n + ')';
    if (st.mode !== 'explore' || !n || rec || player.story) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.innerHTML = '<div class="hd"><span>My list (' + n + ')</span><button data-act="clear">Clear</button></div><ol>' +
      st.sel.map(function (a) { return '<li data-a="' + a + '">' + esc(cname(CONS[a])) + '<b data-x="' + a + '" title="Remove">×</b></li>'; }).join('') + '</ol>';
  }
  $('sel').addEventListener('click', function (e) {
    var t = e.target;
    if (t.dataset.x) toggleSel(t.dataset.x);
    else if (t.dataset.act === 'clear') { st.sel = []; save(); renderSel(); req(); }
    else if (t.dataset.a) flyTo(CONS[t.dataset.a].lra, CONS[t.dataset.a].ldec);
  });

  // ---------- sky stories: record narration + constellation cues, play back (local, IndexedDB) ----------
  // story = { id, title, created, duration, audio: Blob, cues: [{ t, sel: [abbr], view }], subs: [{ t0, t1, text }] }
  // Cues are full snapshots, so the state at time t is simply the last cue with cue.t <= t.
  var DB = null, stories = [], rec = null;
  var player = { story: null, audio: null, url: null, active: [], cue: -1, raf: 0, edit: false, gen: null, place: null };
  function db() {
    return DB || (DB = new Promise(function (res, rej) {
      var r = indexedDB.open('sky-stories', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('stories', { keyPath: 'id' }); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    }));
  }
  function dbReq(mode, fn) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var tx = d.transaction('stories', mode), q = fn(tx.objectStore('stories'));
        tx.oncomplete = function () { res(q.result); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function dbAll() { return dbReq('readonly', function (s) { return s.getAll(); }); }
  function dbPut(x) { return dbReq('readwrite', function (s) { return s.put(x); }); }
  function dbDel(id) { return dbReq('readwrite', function (s) { return s.delete(id); }); }

  function fmtT(t) { t = Math.max(0, t || 0); return Math.floor(t / 60) + ':' + ('0' + Math.floor(t % 60)).slice(-2); }
  // view as field of view (not px/rad) so a story plays the same on any screen size
  function viewNow() { return { proj: st.proj, ra0: +st.ra0.toFixed(2), dec0: +st.dec0.toFixed(2), fov: +(W / st.S).toFixed(4) }; }
  function applyView(v) { if (v.proj !== st.proj) setProj(v.proj); flyTo(v.ra0, v.dec0, W / v.fov); }

  // --- recording ---
  function snap() {
    if (!rec || !rec.t0) return;
    var t = +((performance.now() - rec.t0) / 1000).toFixed(2), last = rec.cues[rec.cues.length - 1];
    var c = { t: t, sel: st.sel.slice(), view: viewNow() };
    if (last && t - last.t < 0.3 && last.sel.join() === c.sel.join()) { last.view = c.view; return; }
    rec.cues.push(c);
  }
  // the mic stream is kept open between takes, so a retake doesn't ask for permission again
  var mic = null;
  function getMic() {
    if (mic && mic.getTracks().every(function (t) { return t.readyState === 'live'; })) return Promise.resolve(mic);
    return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (m) { return (mic = m); });
  }
  function releaseMic() { if (mic) mic.getTracks().forEach(function (t) { t.stop(); }); mic = null; }
  window.addEventListener('pagehide', releaseMic);
  // replace: a story whose take is redone (keeps id, title and creation date)
  function startRec(replace) {
    if (!navigator.mediaDevices || !window.MediaRecorder) { storyMsg('Recording needs microphone access (open the page via https or as a local file).'); return; }
    var title = replace ? replace.title : prompt('Title of the story', 'Little Ursa and her dragon');
    if (!title) return;
    getMic().then(function (stream) { beginRec(title, stream, replace); },
      function (e) { storyMsg('Microphone not available: ' + e.message); });
  }
  function beginRec(title, stream, replace) {
    closePlayer(); setMode('stories');
    rec = { title: title, stream: stream, replace: replace || null, chunks: [], cues: [], t0: 0, keepSel: st.sel, mr: new MediaRecorder(stream) };
    renderStories();
    var n = 3, r = rec;
    r.mr.ondataavailable = function (e) { if (e.data.size) r.chunks.push(e.data); };
    st.sel = []; renderSel(); req();
    renderRec(n);
    r.cd = setInterval(function () {
      if (rec !== r) return clearInterval(r.cd);
      if (--n > 0) return renderRec(n);
      clearInterval(r.cd);
      r.mr.start(250); r.t0 = performance.now(); snap(); renderRec();
      r.iv = setInterval(function () { var e = $('recTime'); if (e) e.textContent = fmtT((performance.now() - r.t0) / 1000); }, 250);
    }, 800);
  }
  function renderRec(count) {
    var b = $('recbar'); b.style.display = 'block';
    b.innerHTML = count
      ? '<div class="big">' + count + '</div><div class="hint" style="text-align:center">Talk, click constellations, rotate and zoom – it all gets recorded.</div>'
      : '<div class="ctl"><span class="dot">●</span><b>REC</b><span id="recTime">0:00</span><i class="ttl">' + esc(rec.title) +
        '</i><span class="sp"></span><button data-act="restart" title="Discard this take and start again">↺ Restart</button><button data-act="stop">■ Stop</button></div><div class="hint">Click a constellation to light it up, click again to switch it off.</div>';
  }
  function endRec() {
    var r = rec; if (!r) return null;
    rec = null; clearInterval(r.cd); clearInterval(r.iv);
    $('recbar').style.display = 'none';
    st.sel = r.keepSel; renderSel(); renderStories(); req();
    return r;
  }
  function restartRec() {
    var r = endRec(); if (!r) return;
    r.mr.onstop = null;
    if (r.mr.state !== 'inactive') r.mr.stop();
    beginRec(r.title, r.stream, r.replace);
  }
  function stopRec() {
    var r = endRec(); if (!r) return;
    var dur = r.t0 ? +((performance.now() - r.t0) / 1000).toFixed(2) : 0;
    r.mr.onstop = function () {
      if (!r.t0) return;   // cancelled during the countdown
      var old = r.replace;
      var s = { id: old ? old.id : 's' + Date.now(), title: r.title, created: old ? old.created : Date.now(), duration: dur,
        audio: new Blob(r.chunks, { type: r.mr.mimeType || 'audio/webm' }), cues: r.cues, subs: [],
        art: old ? old.art || [] : [], sfx: old ? old.sfx || [] : [] };
      dbPut(s).then(loadStories).then(function () { openPlayer(s); });
    };
    if (r.mr.state !== 'inactive') r.mr.stop(); else r.mr.onstop();
  }
  $('recbar').addEventListener('click', function (e) {
    if (e.target.dataset.act === 'stop') stopRec();
    else if (e.target.dataset.act === 'restart') restartRec();
  });

  // --- playback (HTMLAudioElement; an Eduskript build would swap this for Web Audio, CSP blocks media-src) ---
  function repairAudio(s) {
    if (!/webm/.test(s.audio.type)) return Promise.resolve(s);
    return s.audio.arrayBuffer().then(function (buf) {
      var u = new Uint8Array(buf), i = 0;
      while (i < u.length - 3 && !(u[i] === 0x1A && u[i + 1] === 0x45 && u[i + 2] === 0xDF && u[i + 3] === 0xA3)) i++;
      if (i === 0 || i >= u.length - 3) return s;
      s.audio = s.audio.slice(i, u.length, s.audio.type);
      return dbPut(s).then(function () { return s; });
    });
  }
  function openPlayer(s) { repairAudio(s).then(openPlayer2); }
  function openPlayer2(s) {
    closePlayer(); if (st.mode !== 'stories') setMode('stories');
    player.story = s; player.url = URL.createObjectURL(s.audio);
    player.audio = new Audio(player.url);
    player.audio.onended = function () { renderCtl(); $('pSub').textContent = 'Now draw them from memory → ✏️ Draw them'; };
    player.active = []; player.cue = -1; player.edit = false;
    renderPlayer(); applyAt(0); renderSel(); req();
  }
  function closePlayer() {
    if (!player.story) return;
    pausePlayer(); URL.revokeObjectURL(player.url);
    player.story = null; player.audio = null; player.active = []; player.gen = null; player.place = null;
    $('player').style.display = 'none'; renderSel(); req();
  }
  function ptime() { return player.audio ? player.audio.currentTime : 0; }
  function playPlayer() {
    if (player.audio.ended || ptime() >= player.story.duration - 0.05) { player.audio.currentTime = 0; player.cue = -1; }
    player.audio.play().then(loop, function (e) { $('pSub').textContent = 'Cannot play this recording: ' + e.message; renderCtl(); });
    renderCtl();
  }
  function pausePlayer() { if (player.audio) player.audio.pause(); cancelAnimationFrame(player.raf); renderCtl(); }
  function loop() {
    cancelAnimationFrame(player.raf);
    (function f() {
      if (!player.audio) return;
      var t = ptime(); applyAt(t); updTime(); fireSfx(t);
      if (player.story.art && player.story.art.length) req();
      if (!player.audio.paused) player.raf = requestAnimationFrame(f); else renderCtl();

  }
  function renderArtEdit() {
    var s = player.story, gen = player.gen, h = '';
    if (gen) {
      h += '<h4>🎨 Picture for ' + esc(gen.cons.map(cname3).join(', ')) + ' at ' + s.cues[gen.i].t.toFixed(1) + ' s</h4>' +
        '<div class="gen"><input id="artCons" value="' + esc(gen.cons.join(' ')) + '" style="flex:0 0 90px" title="Constellations (abbreviations)">' +
        '<input id="artText" placeholder="e.g. a young bear riding a long dragon" value="' + esc(gen.text) + '">' +
        '<button data-act="artgen"' + (gen.busy ? ' disabled' : '') + '>Generate</button><button data-act="artcancel">×</button></div>' +
        '<div class="hint">' + esc(gen.msg) + '</div><div class="thumbs">' +
        gen.thumbs.map(function (x, k) { return '<img src="' + x.url + '" data-act="artpick" data-k="' + k + '" title="Use this one">'; }).join('') + '</div>';
    }
    if (s.art && s.art.length) h += '<h4>🎨 Pictures</h4>' + s.art.map(function (a, i) {
      return '<div class="cue" data-ai="' + i + '"><span>' + a.t0.toFixed(1) + '–' + a.t1.toFixed(1) + ' s</span><i>' +
        esc(a.cons.map(cname3).join(', ')) + (a.prompt ? ' · ' + esc(a.prompt) : '') + '</i>' +
        '<button data-act="artnudge" data-k="t0" data-d="-0.5">−½</button><button data-act="artnudge" data-k="t0" data-d="0.5">+½</button> … ' +
        '<button data-act="artnudge" data-k="t1" data-d="-0.5">−½</button><button data-act="artnudge" data-k="t1" data-d="0.5">+½</button>' +
        '<button data-act="artplace" title="Move, size and turn it on the sky"' + (player.place === a ? ' style="border-color:#f2c94c"' : '') + '>📌</button>' +
        '<button data-act="artdel">×</button></div>';
    }).join('');
    if (player.place) h += '<div class="hint">📌 Drag = move · wheel = size · Shift + drag/wheel = turn · 📌 again = done</div>';
    return h;
  }

  // --- sound effects at a point in time (local audio files, e.g. CC0 from freesound.org) ---
  var sfxUrls = new WeakMap(), lastT = 0;
  function sfxUrl(b) { var u = sfxUrls.get(b); if (!u) { u = URL.createObjectURL(b); sfxUrls.set(b, u); } return u; }
  function playSfx(x) { var a = new Audio(sfxUrl(x.audio)); a.volume = x.vol == null ? 0.8 : x.vol; a.play().catch(function () {}); }
  function fireSfx(t) {
    var s = player.story;
    if (s.sfx && player.audio && !player.audio.paused && t > lastT && t - lastT < 0.5)   // jumps (seeking) don't fire
      s.sfx.forEach(function (x) { if (x.t > lastT && x.t <= t) playSfx(x); });
    lastT = t;
  }
  function renderSfxEdit() {
    var s = player.story;
    if (!s.sfx || !s.sfx.length) return '';
    return '<h4>🔊 Sounds</h4>' + s.sfx.map(function (x, i) {
      return '<div class="cue" data-xi="' + i + '"><span>' + x.t.toFixed(1) + ' s</span><i>' + esc(x.name) + '</i>' +
        '<input type="range" min="0" max="1" step="0.05" value="' + (x.vol == null ? 0.8 : x.vol) + '" data-xv="' + i + '" style="width:70px" title="Volume">' +
        '<button data-act="sfxnudge" data-d="-0.5">−½ s</button><button data-act="sfxnudge" data-d="0.5">+½ s</button>' +
        '<button data-act="sfxplay">▶</button><button data-act="sfxdel">×</button></div>';
    }).join('');
  }
  $('sfxFile').addEventListener('change', function () {
    var f = this.files[0], s = player.story; this.value = ''; if (!f || !s) return;
    s.sfx = s.sfx || [];
    s.sfx.push({ t: +ptime().toFixed(2), name: f.name.replace(/\.\w+$/, ''), vol: 0.8, audio: f.slice(0, f.size, f.type) });
    s.sfx.sort(function (a, b) { return a.t - b.t; });
    saveStory(); renderEdit();
  });
  $('player').addEventListener('input', function (e) {
    var i = e.target.dataset && e.target.dataset.xv;
    if (i != null) { player.story.sfx[+i].vol = +e.target.value; saveStory(); }
    if (e.target.id === 'artText' && player.gen) player.gen.text = e.target.value;
    if (e.target.id === 'artCons' && player.gen) player.gen.cons = e.target.value.trim().split(/[\s,]+/).filter(Boolean);
  });
  // editor buttons for pictures and sounds; returns true if handled
  function artAct(act, b, s) {
    var ai = b.closest('[data-ai]'), xi = b.closest('[data-xi]'), row = b.closest('.cue');
    if (act === 'artfor') startArt(s, +row.dataset.i);
    else if (act === 'artgen') generateArt(s);
    else if (act === 'artpick') pickArt(s, +b.dataset.k);
    else if (act === 'artcancel') { player.gen = null; renderEdit(); }
    else if (act === 'artnudge') { var a = s.art[+ai.dataset.ai], k = b.dataset.k; a[k] = Math.max(0, +(a[k] + +b.dataset.d).toFixed(2)); saveStory(); renderEdit(); req(); }
    else if (act === 'artdel') { if (player.place === s.art[+ai.dataset.ai]) player.place = null; s.art.splice(+ai.dataset.ai, 1); saveStory(); renderEdit(); req(); }
    else if (act === 'artplace') { var pa = s.art[+ai.dataset.ai]; player.place = player.place === pa ? null : pa; renderEdit(); req(); }
    else if (act === 'addsfx') $('sfxFile').click();
    else if (act === 'sfxnudge') { var x = s.sfx[+xi.dataset.xi]; x.t = Math.max(0, +(x.t + +b.dataset.d).toFixed(2)); saveStory(); renderEdit(); }
    else if (act === 'sfxplay') playSfx(s.sfx[+xi.dataset.xi]);
    else if (act === 'sfxdel') { s.sfx.splice(+xi.dataset.xi, 1); saveStory(); renderEdit(); }
    else return false;
    return true;
  }

  // --- stories list, export/import, Whisper subtitles ---
  function storyMsg(m) { var e = $('stMsg'); if (e) e.textContent = m; else if (m) alert(m); }
  // Recording/editing tools only for the author: the local file, or ?author in the URL. Visitors just play.
  var AUTHOR = location.protocol === 'file:' || /[?&]author\b/.test(location.search);
  var published = [];   // [{ id, title, duration, file }] from ../stories/index.json (published with the site)
  function loadStories() {
    var local = dbAll().then(function (a) {
      stories = (a || []).sort(function (x, y) { return x.created - y.created; });
    }, function () { stories = []; });
    var pub = location.protocol === 'file:' ? Promise.resolve() :
      fetch('../stories/index.json').then(function (r) { return r.ok ? r.json() : []; }).then(function (a) { published = a || []; }, function () {});
    return Promise.all([local, pub]).then(renderStories);
  }
  function allStories() {   // published first (course order), then own local ones; a local copy wins over the published one
    var ids = {}, out = [];
    stories.forEach(function (s) { ids[s.id] = 1; });
    published.forEach(function (p) { if (!ids[p.id]) out.push(p); });
    return out.map(function (p) { return { id: p.id, title: p.title, duration: p.duration, pub: p }; }).concat(stories);
  }
  function scoreBg(x) { return x == null ? '' : 'background:hsla(' + Math.round(120 * x) + ',70%,38%,.45)'; }
  function renderStories() {
    var el = $('storybox');
    if (st.mode !== 'stories' || rec) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    var keep = $('stMsg') ? $('stMsg').textContent : '', list = allStories(), sc = stats.stories || {};
    el.innerHTML = '<div class="hd"><span>📖 Sky Stories</span>' +
      (AUTHOR ? '<button data-act="rec">● Record</button><button data-act="import">Import</button>' : '') + '</div>' +
      '<div class="hint" style="margin:0 0 6px">Listen to a story, then draw its constellations from memory.</div>' +
      (list.length ? list.map(function (s) {
        var x = sc[s.id];
        return '<div class="item" data-id="' + s.id + '" data-act="play" style="' + scoreBg(x) + '"><span class="pl" data-act="play">▶</span>' +
          '<span class="t" data-act="play">' + esc(s.title) + '<br><small data-act="play">' + fmtT(s.duration) + (s.subs && s.subs.length ? ' · CC' : '') + '</small>' +
          (AUTHOR && !s.pub ? '<span class="acts"><b data-act="subs" title="Subtitles with Whisper">CC</b><b data-act="ren" title="Rename">✎</b>' +
            '<b data-act="exp" title="Export as file (to publish: put it into stories/)">⤓</b><b data-act="del" title="Delete">🗑</b></span>' : '') +
          '</span>' + (x != null ? '<span class="sc">' + Math.round(100 * x) + ' %</span>' : '') + '</div>';
      }).join('') : '<div class="hint">' + (AUTHOR ? 'No stories yet. Press ● Record, then tell your story while you click the constellations.' : 'No stories published yet.') + '</div>') +
      '<div class="hint" id="stMsg">' + esc(keep) + '</div>';
  }
  function openAny(s) {   // published stories are fetched on demand
    if (!s.pub) return openPlayer(s);
    storyMsg('Loading “' + s.title + '” …');
    fetch('../stories/' + s.pub.file).then(function (r) { return r.json(); }).then(unpackStory).then(function (x) {
      storyMsg(''); x.published = true; openPlayer(x);
    }).catch(function (e) { storyMsg('Could not load the story: ' + e.message); });
  }
  $('storybox').addEventListener('click', function (e) {
    var act = e.target.dataset.act; if (!act) return;
    var it = e.target.closest('.item'), s = it && allStories().filter(function (x) { return x.id === it.dataset.id; })[0];
    if (act === 'rec') startRec();
    else if (act === 'import') $('importFile').click();
    else if (act === 'play') openAny(s);
    else if (act === 'ren') { var t = prompt('New title', s.title); if (t) { s.title = t; dbPut(s).then(loadStories); } }
    else if (act === 'del') { if (confirm('Delete "' + s.title + '"?')) dbDel(s.id).then(loadStories); }
    else if (act === 'exp') exportStory(s);
    else if (act === 'subs') transcribe(s);
  });
  function exportStory(s) {
    packStory(s).then(function (o) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], { type: 'application/json' }));
      a.download = s.title.replace(/[^\w\-]+/g, '_') + '.skystory';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    });
  }
  $('importFile').addEventListener('change', function () {
    var f = this.files[0]; this.value = ''; if (!f) return;
    f.text().then(function (txt) {
      var o = JSON.parse(txt);
      if (o.format !== 'skystory') throw new Error('not a .skystory file');
      return unpackStory(o).then(dbPut);
    }).then(loadStories).then(function () { storyMsg('Imported.'); }, function (e) { storyMsg('Import failed: ' + e.message); });
  });

  // Whisper runs in the browser (transformers.js); the model (~150 MB) is cached after the first download
  var asr = null;
  function transcribe(s) {
    storyMsg('Loading Whisper …');
    var load = asr || (asr = import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1').then(function (T) {
      return T.pipeline('automatic-speech-recognition', 'onnx-community/whisper-base', {
        progress_callback: function (p) { if (p.status === 'progress' && /onnx/.test(p.file || '')) storyMsg('Downloading Whisper model … ' + Math.round(p.progress) + ' %'); }
      });
    }));
    load.catch(function () { asr = null; });
    Promise.all([load, s.audio.arrayBuffer()]).then(function (r) {
      storyMsg('Transcribing “' + s.title + '” …');
      var ac = new AudioContext({ sampleRate: 16000 });
      return ac.decodeAudioData(r[1]).then(function (ab) {
        ac.close();
        var opts = { return_timestamps: true, chunk_length_s: 30, stride_length_s: 5 };
        if (st.lang.de && !st.lang.en) opts.language = 'german';
        return r[0](ab.getChannelData(0), opts);
      });
    }).then(function (out) {
      s.subs = (out.chunks || []).map(function (c) {
        return { t0: c.timestamp[0], t1: c.timestamp[1] == null ? s.duration : c.timestamp[1], text: c.text.trim() };
      }).filter(function (x) { return x.text && !/^\[[^\]]*\]$/.test(x.text); });   // drop [BLANK_AUDIO] etc.
      return dbPut(s);
    }).then(function () {
      return loadStories();
    }).then(function () {
      storyMsg('Subtitles ready (' + s.subs.length + ' lines). Fix mistakes with ✎ in the player.');
      if (player.story && player.story.id === s.id) { player.story.subs = s.subs; renderPlayer(); }
    }).catch(function (e) { storyMsg('Whisper failed: ' + (e && e.message || e)); });
  }

  // ---------- UI wiring ----------
  function setSeg(id, v) { [].forEach.call($(id).children, function (b) { b.classList.toggle('on', b.dataset.v === v); }); }
  function setMode(m, keepSet) {
    if (!keepSet) st.drawSet = null;
    $('starinfo').style.display = 'none';
    if (m !== 'stories') { closePlayer(); if (rec) stopRec(); }
    st.mode = m; st.target = null; st.answered = false; st.streak = 0; st.score = 0;
    $('sq').dataset.mode = m; setSeg('modes', m);
    $('tip').style.display = 'none';
    if (isQuiz(m)) nextQ(); else { renderQuiz(); req(); }
    renderScore(); renderSel(); renderStories();
  }
  function setProj(p) { st.proj = p; setSeg('projs', p); if (p === 'map') st.dec0 = Math.max(-60, Math.min(60, st.dec0)); if (W) clampS(); req(); }
  $('modes').addEventListener('click', function (e) { if (e.target.dataset.v) setMode(e.target.dataset.v); });
  $('projs').addEventListener('click', function (e) { if (e.target.dataset.v) setProj(e.target.dataset.v); });
  $('level').addEventListener('change', function () { st.level = +this.value; save(); if (isQuiz(st.mode)) { st.target = null; nextQ(); } renderScore(); });
  function renderLang() { [].forEach.call($('langs').children, function (b) { b.classList.toggle('on', !!st.lang[b.dataset.lang]); }); }
  $('langs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var k = b.dataset.lang, other = k === 'en' ? 'de' : 'en';
    st.lang[k] = !st.lang[k];
    if (!st.lang[k] && !st.lang[other]) st.lang[other] = true;   // never both off: switching off the last one swaps
    save(); renderLang(); renderQuiz(); renderSel(); req();
  });
  $('recenter').addEventListener('click', function () { flyTo(0, 0, defaultScale()); });

  $('cv').addEventListener('pointerleave', function () { cv.style.cursor = ''; });
  var LAYERS = [['real', 'Realistic stars (brightness + colour)'], ['lines', 'Constellation lines'], ['bounds', 'Boundaries'], ['names', 'Names'], ['stars', 'Stars'],
    ['messier', 'Messier objects'], ['grid', 'RA/Dec grid'], ['mw', 'Milky Way'], ['ecl', 'Ecliptic + months'], ['gal', 'Galactic equator']];
  $('layers').innerHTML = LAYERS.map(function (l) {
    return '<label><input type="checkbox" data-l="' + l[0] + '"' + (st.layers[l[0]] ? ' checked' : '') + '> ' + l[1] + '</label>';
  }).join('');
  $('layers').addEventListener('change', function (e) { st.layers[e.target.dataset.l] = e.target.checked; req(); });
  $('layersBtn').addEventListener('click', function () { var l = $('layers'); l.style.display = l.style.display === 'block' ? 'none' : 'block'; });

  var fsOn = false;
  function setFs(on) { fsOn = on; $('sq').classList.toggle('fs', on); }
  $('fsBtn').addEventListener('click', function () {
    if (plugin && plugin.requestFullscreen) { fsOn ? plugin.exitFullscreen() : plugin.requestFullscreen(); return; }
    if (document.fullscreenElement) document.exitFullscreen();
    else if ($('sq').requestFullscreen) $('sq').requestFullscreen();
  });
  document.addEventListener('fullscreenchange', function () { if (!plugin) setFs(!!document.fullscreenElement); });

  // pointer: drag to rotate, wheel/pinch to zoom, click to answer
  var ptrs = {}, down = null, moved = false, pinch0 = 0, S0 = 0;
  function local(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener('pointerdown', function (e) {
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    $('starinfo').style.display = 'none';
    if (player.story) pausePlayer();
    ptrs[e.pointerId] = local(e);
    var ids = Object.keys(ptrs);
    if (ids.length === 1) { down = ptrs[e.pointerId]; moved = false; }
    if (ids.length === 2) { var a = ptrs[ids[0]], b = ptrs[ids[1]]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); S0 = st.S; moved = true; }
  });
  cv.addEventListener('pointermove', function (e) {
    var p = local(e);
    if (!ptrs[e.pointerId]) { hover(p); return; }
    var prev = ptrs[e.pointerId]; ptrs[e.pointerId] = p;
    var ids = Object.keys(ptrs);
    if (ids.length === 2) {
      var a = ptrs[ids[0]], b = ptrs[ids[1]];
      st.S = S0 * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch0; clampS(); req(); return;
    }
    if (!moved && Math.hypot(p[0] - down[0], p[1] - down[1]) < 5) return;
    if (!moved) { moved = true; cv.classList.add('drag'); }
    if (player.place) { moveArt(prev, p, e.shiftKey); return; }
    cancelAnimationFrame(anim);
    var dx = p[0] - prev[0], dy = p[1] - prev[1], k = 1 / (st.S * D);
    var c = st.proj === 'map' ? 1 : 1 / Math.max(Math.cos(st.dec0 * D), 0.25);
    st.ra0 = norm360(st.ra0 + dx * k * c);
    st.dec0 = Math.max(st.proj === 'map' ? -60 : -90, Math.min(st.proj === 'map' ? 60 : 90, st.dec0 + dy * k));
    hover(p); req();
  });
  function up(e) {
    var p = ptrs[e.pointerId]; delete ptrs[e.pointerId];
    cv.classList.remove('drag');
    if (player.place) { if (moved) savePlaceSoon(); return; }
    if (p && !moved && Object.keys(ptrs).length === 0 && st.mode === 'draw' && st.target && !st.answered) {
      drawClick(starAt(p[0], p[1]));
    } else if (p && !moved && Object.keys(ptrs).length === 0 && st.mode === 'find' && st.target && !st.answered) {
      var s = unproj(p[0], p[1]), c = s && hit(s[0], s[1]);
      if (c) answer(c);
    } else if (p && !moved && Object.keys(ptrs).length === 0 && freeMode() && !rec && !player.edit && starAt(p[0], p[1]) >= 0) {
      showStar(starAt(p[0], p[1]), p[0], p[1]);
    } else if (p && !moved && Object.keys(ptrs).length === 0 && freeMode()) {
      var s2 = unproj(p[0], p[1]), c2 = s2 && hit(s2[0], s2[1]);
      if (c2 && player.story) { if (player.edit) editToggle(c2.abbr); }
      else if (c2 && (rec || st.mode === 'explore')) toggleSel(c2.abbr);
    } else if (p && moved && rec) snap();
  }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', function () { $('tip').style.display = 'none'; });
  cv.addEventListener('wheel', function (e) {
    e.preventDefault(); cancelAnimationFrame(anim);
    if (player.place) {
      var q = placeOf(player.place);
      if (e.shiftKey) q.r += (e.deltaY || e.deltaX) * 0.002; else q.s *= Math.exp(-e.deltaY * 0.0015);
      savePlaceSoon(); req(); return;
    }
    st.S *= Math.exp(-e.deltaY * 0.0015); clampS(); req();
    if (player.story) pausePlayer();
    if (rec) { clearTimeout(wheelT); wheelT = setTimeout(snap, 250); }
  }, { passive: false });
  var wheelT = 0;

  function hover(p) {
    var s = unproj(p[0], p[1]), tip = $('tip');
    $('coord').textContent = s ? 'RA ' + fmtRA(s[0]) + '   Dec ' + fmtDec(s[1]) : '';
    cv.style.cursor = (freeMode() || st.mode === 'draw') && starAt(p[0], p[1]) >= 0 ? 'pointer' : '';
    if (!freeMode() || !s) { tip.style.display = 'none'; return; }
    var c = hit(s[0], s[1]);
    if (!c) { tip.style.display = 'none'; return; }
    tip.innerHTML = '<i>' + esc(cname(c)) + '</i> · ' + c.abbr;
    tip.style.display = 'block';
    tip.style.left = Math.min(p[0] + 14, W - tip.offsetWidth - 4) + 'px';
    tip.style.top = (p[1] + 16) + 'px';
  }

  function resize() {
    var r = $('stage').getBoundingClientRect();
    if (!r.width || !r.height) return;
    var first = !W;
    dpr = window.devicePixelRatio || 1; W = r.width; H = r.height; cx = W / 2; cy = H / 2;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    if (first) st.S = defaultScale();
    clampS(); draw();
  }

  function start(cfg) {
    cfg = cfg || {};
    if (+cfg.height) $('sq').style.setProperty('--h', +cfg.height + 'px');
    if (cfg.level != null && cfg.level !== '') st.level = Math.max(0, Math.min(3, +cfg.level || 0));
    if (st.level === 0 && !st.sel.length) st.level = 1;
    if (cfg.lang) { var ls = String(cfg.lang).split(/[ ,]+/); st.lang = { en: ls.indexOf('en') >= 0, de: ls.indexOf('de') >= 0 }; if (!st.lang.de) st.lang.en = true; }
    // stories need the standalone page (Eduskript's iframe CSP blocks the audio for now)
    var storiesOK = document.body.classList.contains('standalone');
    if (!storiesOK) $('modes').querySelector('[data-v=stories]').style.display = 'none';
    renderLang();
    $('level').value = String(st.level);
    setProj(cfg.projection === 'sphere' ? 'sphere' : 'map');
    new ResizeObserver(resize).observe($('stage'));
    resize();
    var modes = ['explore', 'name', 'find', 'draw'].concat(storiesOK ? ['stories'] : []);
    setMode(modes.indexOf(cfg.mode) >= 0 ? cfg.mode : storiesOK ? 'stories' : 'explore');
    if (storiesOK) loadStories();
  }
  function applyTheme(t) { document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); }

  if (typeof window.eduskript !== 'undefined') {
    plugin = eduskript.init();
    plugin.onReady(function (ctx) { applyTheme(ctx.theme); restore(ctx.data); start(ctx.config); });
    plugin.onThemeChange(applyTheme);
    plugin.onDataChanged(function (d) { restore(d); renderScore(); renderSel(); req(); });
    if (plugin.onFullscreenChange) plugin.onFullscreenChange(setFs);
  } else {
    try { restore(JSON.parse(localStorage.getItem('sky-quiz'))); } catch (e) {}
    var q = {}; location.search.replace(/[?&]([^=&]+)=([^&]*)/g, function (_, k, v) { q[k] = decodeURIComponent(v); });
    start(q);
    if (q.debug) window.__sky = { st: st, CONS: CONS, proj: proj, segsOf: segsOf, SKY: SKY, player: player, open: openPlayer2, renderEdit: renderEdit };   // test hook
  }
})();
</script>
