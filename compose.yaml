# Runs next to Atlas on the same VPS; Atlas' Caddy proxies skystories.eduskript.org to skystories-app:3000.
services:
  skystories:   # not "app": that name is Atlas' service on the shared network
    build: .
    container_name: skystories-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./storage:/app/data
    networks: [atlas]

networks:
  atlas:
    external: true
    name: atlas_default
